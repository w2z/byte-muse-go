  /strm/directories:
    get:
      operationId: listStrmDirectories
      summary: 浏览本地 strm 目录
      description: 列出 strm 根目录下某个目录的直接子目录，供设置页选择 strm 生成目录。根目录固定为 /strm；浏览范围固定在该根目录以内，根目录以上的路径会被拒绝。每次请求实时读盘，外部新建的目录重新请求即可看到。
      parameters:
        - {in: cookie, name: bytemuse_session, required: true, schema: {type: string}, description: 登录签发的管理员会话 Cookie}
        - {in: query, name: path, schema: {type: string}, description: '相对固定 /strm 根目录的路径，以 / 开头；省略或空串表示根目录'}
      responses:
        '200':
          description: 当前目录的直接子目录；不返回文件
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StrmDirectoryPage'}
              example: {path: /, directories: [{name: movies, path: /movies}]}
        '400':
          description: 路径非法、超出固定 /strm 根目录或目录不存在
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: strm 服务未装配
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    post:
      operationId: createStrmDirectory
      summary: 新建本地 strm 目录
      description: 在 strm 根目录内的指定父目录下新建一级目录；根目录固定为 /strm。父目录必须已存在，目录名不能包含路径分隔符，同名目录已存在时返回 400。只创建一级，避免一次请求产生隐式目录树。
      parameters:
        - {in: cookie, name: bytemuse_session, required: true, schema: {type: string}, description: 登录签发的管理员会话 Cookie}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, name]
              additionalProperties: false
              properties:
                path: {type: string, description: '父目录相对固定 /strm 根目录的路径，以 / 开头；省略或空串表示根目录'}
                name: {type: string, description: 新目录名称；不能为空，不能是 . 或 ..，不能包含路径分隔符}
            example: {path: /, name: movies}
      responses:
        '201':
          description: 已创建的目录
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StrmDirectory'}
              example: {name: movies, path: /movies}
        '400':
          description: 目录名非法、目录已存在、上级目录不存在或路径超出固定 /strm 根目录
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: strm 服务未装配
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /strm/clouddrive/directories:
    get:
      operationId: listStrmCloudDriveDirectories
      summary: 浏览 CloudDrive2 目录
      description: 列出 CloudDrive2 网盘中某个目录的直接子目录，供设置页选择 strm 映射的网盘路径。数据来自网盘，不受本地 strm 根目录限制；只返回目录。
      parameters:
        - {in: cookie, name: bytemuse_session, required: true, schema: {type: string}, description: 登录签发的管理员会话 Cookie}
        - {in: query, name: path, schema: {type: string}, description: '网盘绝对路径，以 / 开头；省略或空串表示网盘根目录'}
      responses:
        '200':
          description: 当前网盘目录的直接子目录
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StrmDirectoryPage'}
              example: {path: /115, directories: [{name: 电影, path: /115/电影}]}
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: CloudDrive2 尚未配置
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: strm_not_configured, message: 'CloudDrive2 尚未配置'}
        '502':
          description: 'CloudDrive2 返回错误；message 为本地生成的脱敏中文说明'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: strm 服务未装配
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /strm/scan:
    post:
      operationId: scanStrm
      summary: 生成 strm 文件
      description: 按设置项 STRM_PATHS 把网盘目录镜像成本地 strm 文件，写入固定 /strm 根目录，每条映射仅处理其 formats 中的文件扩展名，文件内容为 {基址}/files/play/{网盘类型}/{文件标识}。递归扫描时按该映射的 exclude 规则跳过文件与文件夹：equals 要求完整名称相等、prefix 前缀、suffix 后缀、contains 包含，一律不区分大小写；命中文件夹时整棵子树都不生成。同时跳过体积小于 min_size_mb 的视频，网盘未返回体积的文件不受体积限制。重复执行幂等，内容一致时不改写磁盘。基址取 STRM_PLAY_BASE，为空时使用本次请求的来源地址；STRM_EMBY_REFRESH 为 true 且已配置 Emby 地址与密钥时额外刷新媒体库。单条映射失败不影响其他映射，失败原因通过 message 返回。
      parameters:
        - {$ref: '#/components/parameters/ScanProgressAccept'}
        - {in: cookie, name: bytemuse_session, required: true, schema: {type: string}, description: 登录签发的管理员会话 Cookie}
      responses:
        '200':
          description: 本次生成的汇总结果；无失败映射时 mappings[].message 为空串
          content:
            application/x-ndjson:
              schema: {$ref: '#/components/schemas/StrmScanStreamEvent'}
              example: '{"type":"progress","progress":{"phase":"processing","processed":20,"total":50,"percent":40,"current":"/movies"}}'
            application/json:
              schema: {$ref: '#/components/schemas/StrmScanResult'}
              example: {mappings: [{kind: '115', path: /电影, local_path: /movies, files: 12, created: 12, unchanged: 0, failed: 0, message: ''}], files: 12, created: 12, failed: 0, emby: {attempted: false, refreshed: false, message: ''}}
        '400':
          description: STRM_PATHS 配置非法
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 尚未配置网盘映射、缺少访问基址或网盘服务未就绪
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: strm 服务未装配
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /files/play/{kind}/{fileId}:
    servers:
      - url: /
    get:
      operationId: playStrmFile
      summary: 解析并跳转网盘播放地址
      description: 'strm 文件里的播放地址入口，不要求登录会话：实际地址为 {ByteMuse 地址}/files/play/{kind}/{fileId}，位于 /api/v1 之外。115 返回 302 跳转到绑定换取时 User-Agent 的直链；CloudDrive2 直链要求固定请求头时由服务端代理转发。CloudDrive2 的文件标识是网盘绝对路径，按 / 拆段后逐段 URL 编码，因此 fileId 会占用多个路径段。'
      security: []
      parameters:
        - {in: path, name: kind, required: true, schema: {type: string, enum: ['115', 'cd2']}, description: '网盘类型；115 为 115 网盘，cd2 为 CloudDrive2'}
        - {in: path, name: fileId, required: true, schema: {type: string}, description: '网盘文件标识；115 为文件 ID，CloudDrive2 为网盘绝对路径'}
      responses:
        '302':
          description: 重定向到网盘直链
        '200':
          description: 服务端代理转发网盘直链，用于直链要求固定 User-Agent 或附加请求头的情况
        '400':
          description: 网盘类型或文件标识非法
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: 网盘中不存在该文件
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 网盘服务未就绪、115 未绑定或 CloudDrive2 未配置
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '502':
          description: 网盘未返回可用的播放地址
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: strm 服务未装配
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /covers/{code}:
    get:
      operationId: getMediaCover
      summary: 读取或缓存影片封面
      description: '影片主封面的统一入口，页面按番号请求该地址。服务端按番号把封面持久化到 /data/cover：命中缓存直接返回本地文件，未命中先下载再落盘，落盘文件名是番号加图片真实格式，例如 sons-1223.png。source 必须是不带凭据的 http/https 绝对地址；缓存目录默认 /data/cover，可用 COVER_ROOT 环境变量覆盖。目录不可写、源站失败或番号不能作为文件名时返回 302 回退到 source，页面表现与没有缓存时一致。设置页「外网访问地址」（EXTERNAL_DOMAIN）已配置时，页面封面与企业微信封面推送都改用 {外网访问地址} 前缀访问本接口，第三方与页面取到同一张图。'
      parameters:
        - {in: cookie, name: bytemuse_session, required: true, schema: {type: string}, description: 登录签发的管理员会话 Cookie}
        - {in: path, name: code, required: true, schema: {type: string}, description: 影片番号；作为缓存文件名主干，只保留字母、数字、连字符与下划线并转小写}
        - {in: query, name: source, required: true, schema: {type: string}, description: 封面源地址，需 URL 编码的 http/https 绝对地址；缓存失败时作为回退跳转目标}
      responses:
        '200':
          description: 封面图片二进制；命中缓存或下载成功后返回，Content-Type 为图片真实类型
          headers:
            Cache-Control:
              description: 固定为 private, max-age=86400，浏览器一天内复用本地封面
              schema: {type: string}
          content:
            image/*:
              schema: {type: string, format: binary}
        '302':
          description: 缓存目录不可写、源站失败或番号不能作为文件名时回退到 source
        '400':
          description: source 缺失或不是不带凭据的 http/https 绝对地址
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /message:
    get:
      operationId: verifyWeChatCallback
      summary: 企业微信回调地址校验
      description: 企业微信在保存回调 URL 时发起。用 msg_signature、timestamp、nonce 校验签名，解密 echostr 后原样回写明文。不要求登录会话，安全性由回调签名与 AES 解密保证。未配置 WECHAT_TOKEN、WECHAT_ENCODING_AES_KEY 或 WECHAT_CORP_ID 时返回 503。
      parameters:
        - {name: msg_signature, in: query, required: true, description: 企业微信回调签名，sha1 十六进制小写, schema: {type: string}}
        - {name: timestamp, in: query, required: true, description: 回调时间戳（秒）, schema: {type: string}}
        - {name: nonce, in: query, required: true, description: 回调随机串, schema: {type: string}}
        - {name: echostr, in: query, required: true, description: 加密的回显字符串，解密后原样回写, schema: {type: string}}
      responses:
        '200':
          description: 校验成功，响应体为解密后的明文 echostr
          content:
            text/plain:
              schema: {type: string}
              example: '1616140317555161061'
        '400':
          description: 参数缺失、签名校验失败或解密失败
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: wechat_verify_failed, message: 回调校验失败}
        '503':
          description: 企业微信回调未配置
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: wechat_not_configured, message: 企业微信回调未配置}
    post:
      operationId: receiveWeChatMessage
      summary: 接收企业微信应用消息
      description: 解密企业微信应用消息并交给渠道 Agent。支持 MsgType=text 的文本消息，以及 MsgType=event 且 Event=template_card_event 的模板卡片按钮点击（EventKey 即按钮载荷，形如 bm:pause:SSIS-001）；其他消息返回 200 且不产生回复。发送番号返回带封面与操作按钮的模板卡片，按钮点击执行订阅、取消订阅、开始下载、暂停、继续、重试等确定性业务，该流程不经过 AI 对话；只有中文自然语言提问才进入 Agent 对话。企业微信要求 5 秒内响应，因此本接口先返回空响应，回复通过应用消息接口异步发送，形态可能是文本、图文或模板卡片。不要求登录会话，安全性由回调签名与 AES 解密保证。
      parameters:
        - {name: msg_signature, in: query, required: true, description: 企业微信回调签名，sha1 十六进制小写, schema: {type: string}}
        - {name: timestamp, in: query, required: true, description: 回调时间戳（秒）, schema: {type: string}}
        - {name: nonce, in: query, required: true, description: 回调随机串, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/xml:
            schema: {type: string}
            example: '<xml><ToUserName><![CDATA[ww1234567890abcdef]]></ToUserName><Encrypt><![CDATA[base64-encrypted-payload]]></Encrypt><AgentID><![CDATA[1000002]]></AgentID></xml>'
      responses:
        '200':
          description: 已受理。响应体为空，回复不在此响应返回
          content:
            text/plain:
              schema: {type: string}
              example: ''
        '400':
          description: 请求体超限、签名校验失败或解密失败
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: wechat_decrypt_failed, message: 回调校验失败}
        '503':
          description: 企业微信回调未配置
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: wechat_not_configured, message: 企业微信回调未配置}
  /health/live:
    get:
      operationId: live
      summary: 存活探针
      security: []
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      operationId: ready
      summary: 就绪探针
      security: []
      responses:
        '200':
          description: 数据库和迁移已就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: 服务未就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: bytemuse_session
  parameters:
    ScanProgressAccept:
      in: header
      name: Accept
      required: false
      description: '传 application/x-ndjson 接收逐行进度事件和最终结果；省略或 application/json 保持原同步 JSON 响应。进度按当前已发现总数计算并动态更新。'
      schema: {type: string, enum: [application/json, application/x-ndjson], default: application/json}
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: 每页条数。上限与 application.MaxPageSize 一致，前端分页条的每页条数选项不会超过该值。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        minLength: 26
        maxLength: 26
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    Unauthorized:
      description: 未登录或会话失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 当前状态不允许该操作
      content:
        application/json:
          schema:
