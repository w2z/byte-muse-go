openapi: 3.1.0
info:
  title: ByteMuse API
  version: 0.1.0
  description: ByteMuse Go 第一阶段公开契约。所有时间均为 UTC RFC 3339。
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，响应同时设置 HttpOnly 会话 Cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      operationId: refreshSession
      security: []
      summary: 续签当前会话
      description: |
        不接收请求体，直接使用请求携带的 bytemuse_session Cookie 续签。
        会话仍有效、或过期未超过 24 小时宽限窗口时，下发新 Cookie 并把有效期续回满额
        （未勾选“记住密码”1 天，勾选后 30 天）；超出宽限窗口返回 401，前端需要跳转登录页。
      responses:
        '200':
          description: 续签成功，响应同时刷新 HttpOnly 会话 Cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      summary: 注销当前会话
      responses:
        '204':
          description: 已清除当前会话 Cookie
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dashboard:
    get:
      operationId: getDashboard
      responses:
        '200':
          description: 仪表盘汇总
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
  /media:
    get:
      operationId: listMedia
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: query
          in: query
          schema:
            type: string
            maxLength: 100
        - name: subscription_status
          in: query
          schema:
            $ref: '#/components/schemas/SubscriptionStatus'
      responses:
        '200':
          description: 影片分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
  /media/{mediaId}:
    get:
      operationId: getMedia
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: 影片详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '404':
          $ref: '#/components/responses/NotFound'
  /ranks:
    get:
      operationId: listRanks
      summary: 查询榜单
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: type
          in: query
          description: 榜单类型；省略时使用 monthly
          schema:
            type: string
            enum: [daily, weekly, monthly]
            default: monthly
      responses:
        '200':
          description: 按数据库中榜单快照顺序返回媒体分页数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
  /codes/release_today:
    get:
      operationId: listReleaseToday
      summary: 查询今日上新
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 仅返回发布日期等于服务当前本地日期的数据库媒体分页数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
  /codes/recommend:
    get:
      operationId: listRecommendations
      summary: 查询推荐
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 根据数据库中的订阅、完成记录及媒体元数据计算的推荐分页数据；没有偏好数据时返回空列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
  /complex/search:
    get:
      operationId: searchCatalog
      summary: 综合搜索
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: 按番号、原始标题或翻译标题搜索；空值返回全部数据库媒体
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: 数据库搜索结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
  /actors:
    get:
      operationId: listActors
      summary: 查询演员列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: subscription
          in: query
          description: 按演员订阅状态筛选；all 为全部，active 为已订阅，none 为未订阅
          schema:
            type: string
            enum: [all, active, none]
            default: all
      responses:
        '200':
          description: 演员分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorPage'
  /actors/{actorName}/subscription:
    parameters:
      - name: actorName
        in: path
        required: true
        description: 演员名称，允许中文与空格，调用方须进行 URL 编码
        schema:
          type: string
          minLength: 1
    put:
      operationId: saveActorSubscription
      summary: 创建或编辑演员订阅
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorSubscriptionRequest'
      responses:
        '200':
          description: 已保存演员订阅限制日期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        '400':
          description: 日期不是 YYYY-MM-DD 格式
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: cancelActorSubscription
      summary: 取消演员订阅
      description: 仅清空演员的限制日期，保留演员资料，便于后续重新订阅。
      responses:
        '200':
          description: 已取消演员订阅，limit_date 返回 null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        '404':
          $ref: '#/components/responses/NotFound'
  /subscriptions:
    get:
      operationId: listSubscriptions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: 订阅列表状态；订阅页固定使用 active，取消后的记录不会返回
          schema:
            $ref: '#/components/schemas/SubscriptionStatus'
      responses:
        '200':
          description: 订阅分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPage'
    post:
      operationId: createSubscription
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '201':
          description: 已创建订阅
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '200':
          description: 幂等重放，返回已有订阅
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '409':
          description: 该番号已经存在活动订阅，不会重复添加；客户端应刷新列表并展示本地文件状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /subscriptions/{subscriptionId}/cancel:
    post:
      operationId: cancelSubscription
      summary: 删除订阅
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      responses:
        '200':
          description: 已删除订阅记录；媒体保留，排队或搜索中的下载任务删除，已提交任务保留
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '404':
          $ref: '#/components/responses/NotFound'
  /subscriptions/{subscriptionId}:
    put:
      operationId: updateSubscription
      summary: 编辑活动订阅
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionRequest'
      responses:
        '200':
          description: 已更新订阅，version 自增
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 版本已变化，或订阅记录已不存在而不能再编辑
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /downloads:
    get:
      operationId: listDownloads
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DownloadStatus'
      responses:
        '200':
          description: 下载任务分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadPage'
  /tasks:
    get:
      operationId: listScheduledTasks
      summary: 查询定时任务
      description: 返回调度器中已配置的后台定时任务、原始 Cron 表达式、最近执行时间和当前执行状态；该接口不是下载任务列表。
      parameters:
        - name: all
          in: query
          description: 设为 true 时返回全部定时任务，不分页；省略时使用分页参数。
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 定时任务列表；all=true 时返回全部任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledTaskPage'
  /tasks/{taskName}/run:
    post:
      operationId: runScheduledTask
      summary: 立即执行定时任务
      parameters:
        - name: taskName
          in: path
          required: true
          description: 定时任务名称
          schema:
            type: string
      responses:
        '202':
          description: 任务已开始执行
        '404':
          description: 定时任务不存在
        '409':
          description: 任务正在执行中
  /logs:
    get:
      operationId: listLogs
      summary: 查询持久化系统日志
      description: 查询数据库中持久化的系统日志；服务重启后日志仍然保留。
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: 日志每页条数；前端可选 100、200、300、400、500，默认 100。
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: level
          in: query
          schema:
            type: string
            enum: [debug, info, warning, error]
        - name: category
          in: query
          schema:
            type: string
            description: 日志业务分类
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
        - name: start_time
          in: query
          description: 按日志 logged_at 筛选的起始时间（包含），使用 RFC3339 格式。
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: 按日志 logged_at 筛选的结束时间（包含），使用 RFC3339 格式。
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 按时间倒序返回日志分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogPage'
        '400':
          description: 日志筛选参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 日志查询失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: clearLogs
      summary: 清空持久化系统日志
      description: 按 level、category、keyword、start_time、end_time 删除匹配日志；未提供筛选条件时删除全部日志，删除后无法恢复。
      parameters:
        - name: level
          in: query
          schema:
            type: string
            enum: [debug, info, warning, error]
        - name: category
          in: query
          schema:
            type: string
            description: 日志业务分类
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
        - name: start_time
          in: query
          description: 按日志 logged_at 筛选的起始时间（包含），使用 RFC3339 格式。
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: 按日志 logged_at 筛选的结束时间（包含），使用 RFC3339 格式。
          schema:
            type: string
            format: date-time
      responses:
        '204':
          description: 匹配的数据库系统日志已永久删除
        '400':
          description: 日志筛选参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 日志清空失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /system/settings:
    get:
      operationId: getSystemSettings
      responses:
        '200':
          description: 已登录管理员可读取的系统设置；敏感值会以明文值回显，前端使用密码控件显示
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
    put:
      operationId: updateSystemSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemSettingsUpdate'
      responses:
        '200':
          description: 已保存并返回当前分组的完整系统设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
        '400':
          description: 包含不支持的设置项或请求体无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /health/live:
    get:
      operationId: live
      security: []
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      operationId: ready
      security: []
      responses:
        '200':
          description: 数据库和迁移已就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: 服务未就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: bytemuse_session
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: 每页条数。上限与 application.MaxPageSize 一致，前端分页条的每页条数选项不会超过该值。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        minLength: 26
        maxLength: 26
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    Unauthorized:
      description: 未登录或会话失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 当前状态不允许该操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 8
          maxLength: 256
        remember:
          type: boolean
          default: false
          description: 勾选“记住密码”时为 true，会话有效期由 1 天延长至 30 天；省略按 false 处理。
    LoginResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
        username:
          type: string
    Media:
      type: object
      required: [id, code, title, still_photos, subscription_status, library_status, display_status, created_at, updated_at]
      properties:
        id:
          type: string
        code:
          type: string
          description: 原始番号，保留数据源中的空格和大小写
        title:
          type: string
        translated_title:
          type: [string, 'null']
        poster_url:
          type: [string, 'null']
          format: uri
          description: 竖版或备用封面；banner_url 为空时用于卡片回退
        banner_url:
          type: [string, 'null']
          format: uri
          description: 横向大图，番号宫格优先展示该字段
        preview_url:
          type: [string, 'null']
          format: uri
          description: 预告视频地址；null 表示没有可播放预告
        still_photos:
          type: array
          description: 按数据源顺序排列的剧照地址；没有剧照时为空数组
          items:
            type: string
            format: uri
        release_date:
          type: [string, 'null']
          format: date
        duration_minutes:
          type: [integer, 'null']
          minimum: 0
        subscription_status:
          $ref: '#/components/schemas/SubscriptionStatus'
        library_status:
          $ref: '#/components/schemas/LibraryStatus'
        display_status:
          $ref: '#/components/schemas/MediaDisplayStatus'
        active_subscription:
          description: 当前活动订阅摘要；未订阅时为 null
          oneOf:
            - $ref: '#/components/schemas/SubscriptionSummary'
            - type: 'null'
        download_status:
          description: 最近下载任务状态；从未创建下载任务时为 null
          oneOf:
            - $ref: '#/components/schemas/DownloadStatus'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MediaPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Media'
    Actor:
      type: object
      required: [name, photo, limit_date]
      properties:
        name:
          type: string
          description: 演员名称，也是写接口中的稳定标识
        photo:
          type: [string, 'null']
          format: uri
          description: 演员头像地址；null 表示暂无头像
        limit_date:
          type: [string, 'null']
          format: date
          description: 订阅检索的最早发行日期；null 表示未订阅
    ActorSubscriptionRequest:
      type: object
      required: [limit_date]
      properties:
        limit_date:
          type: string
          format: date
          description: 订阅检索的最早发行日期，格式必须为 YYYY-MM-DD
    ActorPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Actor'
    Subscription:
      type: object
      required: [id, media_id, status, mode, filter, created_at, updated_at, version]
      properties:
        id:
          type: string
        media_id:
          type: string
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        mode:
          type: string
          enum: [strict, preload]
        filter:
          $ref: '#/components/schemas/SubscriptionFilter'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
          description: 乐观锁版本；每次编辑成功后加一，取消接口返回删除前的快照且不再持久化该记录
        media:
          description: 订阅列表内嵌的媒体卡片数据；单条写操作响应可省略
          $ref: '#/components/schemas/Media'
    SubscriptionSummary:
      type: object
      required: [id, media_id, status, mode, filter, created_at, updated_at, version]
      properties:
        id:
          type: string
        media_id:
          type: string
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        mode:
          type: string
          enum: [strict, preload]
        filter:
          $ref: '#/components/schemas/SubscriptionFilter'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    SubscriptionFilter:
      type: object
      description: 资源筛选规则；布尔字段省略时按 false，体积字段为 null 时不限制
      additionalProperties: true
      properties:
        only_chinese:
          type: boolean
          description: 仅选择带中文字幕的资源
        only_uc:
          type: boolean
          description: 仅选择无码资源
        exclude_uc:
          type: boolean
          description: 排除无码资源
        only_free:
          type: boolean
          description: 仅选择免费资源
        only_uhd:
          type: boolean
          description: 仅选择 UHD 资源
        exclude_uhd:
          type: boolean
          description: 排除 UHD 资源
        min_size:
          type: [number, 'null']
          minimum: 0
          description: 最小资源体积，单位 MB；null 表示不限制
        max_size:
          type: [number, 'null']
          minimum: 0
          description: 最大资源体积，单位 MB；null 表示不限制
    CreateSubscriptionRequest:
      type: object
      required: [media_id, mode]
      properties:
        media_id:
          type: string
        mode:
          type: string
          enum: [strict, preload]
          description: strict 为严格模式，preload 为预下载模式
        filter:
          $ref: '#/components/schemas/SubscriptionFilter'
          default: {}
    UpdateSubscriptionRequest:
      type: object
      required: [mode, filter, version]
      properties:
        mode:
          type: string
          enum: [strict, preload]
          description: strict 为严格模式，preload 为预下载模式
        filter:
          $ref: '#/components/schemas/SubscriptionFilter'
        version:
          type: integer
          minimum: 1
          description: 客户端最后读取到的订阅版本，过期时返回 409
    SubscriptionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Subscription'
    DownloadTask:
      type: object
      required: [id, media_id, status, created_at, updated_at]
      properties:
        id:
          type: string
        media_id:
          type: string
        status:
          $ref: '#/components/schemas/DownloadStatus'
        external_id:
          type: [string, 'null']
        error_message:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DownloadPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/DownloadTask'
    ScheduledTask:
      type: object
      required: [name, cron, last_run, running]
      properties:
        name:
          type: string
          description: 定时任务名称
        cron:
          type: string
          description: 五段式 Cron 表达式
        last_run:
          type: [string, 'null']
          format: date-time
          description: 最近一次开始执行的时间；进程重启后为空
        running:
          type: boolean
          description: 当前是否正在执行
    ScheduledTaskPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ScheduledTask'
    LogRecord:
      type: object
      required: [time, level, category, message]
      properties:
        time:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warning, error]
        category:
          type: string
        message:
          type: string
        attrs:
          type: object
          description: 原样保存的附加字段，不进行敏感值脱敏
          additionalProperties: true
    LogPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/LogRecord'
    Dashboard:
      type: object
      required: [active_subscriptions, completed_downloads, media_count]
      properties:
        active_subscriptions:
          type: integer
        completed_downloads:
          type: integer
        media_count:
          type: integer
    SystemSettings:
      type: object
      required: [database_driver, values, configured]
      properties:
        database_driver:
          type: string
          enum: [sqlite, postgres, mysql]
          description: 数据库引擎，由部署环境管理，只读
        values:
          type: object
          additionalProperties:
            type: string
          description: >-
            设置值。键名与旧版 template.env、对标站 /config 一致；敏感值也会在已登录管理员会话中回显，
            按对标站设置页分组维护：站点、Emby、Plex、Jellyfin、微信、Telegram、Qbittorrent、
            Transmission、迅雷、CloudDrive2、过滤、排序、定时任务、翻译、Agent、其他。
            布尔取值固定为 true / false；数字为非负整数字符串；DEFAULT_FILTER 为过滤规则 JSON 字符串；
            DEFAULT_SORT 为逗号分隔的排序标签（uc、!uc、seeders、chinese、uhd、!uhd、site、free）；
            MAIN_SITE 取 ALL / 馒头 / BT / PTT / NicePT / Rousi；IMAGE_MODE 取 INVISIBLE / VISIBLE / BLUR；LOG_RETENTION_DAYS 为日志保留天数，默认 30，0 或空值表示不自动删除；TRANSLATION_ENGINE 取 none / openai / google / baidu / deeplx；DEEPLX_URL 为 DeepLX 服务地址（例如 http://127.0.0.1:1188）；TRANSLATION_PROMPT 仅在 OpenAI 翻译时作为翻译 system prompt，留空使用内置提示词；AGENT_SYSTEM_PROMPT 仅用于 Telegram/Agent 对话，留空使用内置提示词。
        configured:
          type: object
          additionalProperties:
            type: boolean
          description: 敏感设置是否已经配置；与 values 中的敏感值配套，用于兼容客户端判断
    SystemSettingsUpdate:
      type: object
      required: [values]
      properties:
        values:
          type: object
          additionalProperties:
            type: string
          description: >-
            待保存的业务设置，只提交当前分组；页面应提交当前字段的完整值。普通字段和敏感字段的空值都会保存为空，
            用于显式清除配置；保存其他字段时不要提交未编辑的敏感字段。
            取值域与 SystemSettings.values 一致，越界或未声明的键返回 400 invalid_setting。
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    SubscriptionStatus:
      type: string
      enum: [none, active, canceled]
    DownloadStatus:
      type: string
      enum: [queued, searching, submitted, downloading, completed, failed, unknown]
    MediaDisplayStatus:
      type: string
      description: 卡片统一展示状态，由服务端按媒体库、下载任务和活动订阅的优先级计算
      enum: [unsubscribed, subscribed, downloading, completed, failed, unknown]
    LibraryStatus:
      type: string
      enum: [unknown, absent, present]
security:
  - sessionCookie: []
