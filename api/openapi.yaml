            WECHAT_NOTIFY_AGENT_CHAT: {type: string, enum: ['true', 'false'], default: 'true', example: 'true', description: '微信 Agent 对话开关，默认开启；关闭后自然语言对话被拒绝，斜杠命令与番号订阅不受影响'}
            TELEGRAM_NOTIFY_SUBSCRIBE: {type: string, enum: ['true', 'false'], default: 'false', example: 'false', description: 'Telegram 订阅成功通知开关，默认关闭'}
