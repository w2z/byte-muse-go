    SystemSettingsUpdate:
      type: object
      required: [values]
      properties:
        values:
          type: object
          additionalProperties:
            type: string
          description: >-
            待保存的业务设置，只提交当前分组；页面应提交当前字段的完整值。普通字段和敏感字段的空值都会保存为空，
            用于显式清除配置；保存其他字段时不要提交未编辑的敏感字段。
            取值域与 SystemSettings.values 一致，越界或未声明的键返回 400 invalid_setting。
            AGENT_SYSTEM_PROMPT 和 TRANSLATION_PROMPT 各允许最多 61440 个 UTF-8 字节，其他值最多 8192 字节；按去除首尾空白前的输入计算，超限拒绝整批且不截断。
            站点模式与两种凭据可同时提交；只修改模式不应清空另一种凭据，显式提交空字符串才清除密钥或 Cookie。
            BYPASS_ENGINE 的 cloudflare_bypass_for_scraping 在页面显示为 ByPass，协议值不变。BYPASS_USE_PROXY 默认 false；关闭增强时同一事务强制关闭代理开关，再次启用增强不会自动开启代理。Scrapling HTTP 协议尚未接入。
            RANK_SCHEDULE_TIME、ACTOR_SCHEDULE_TIME、TAG_SCHEDULE_TIME、DOWNLOAD_SCHEDULE_TIME 只接受标准 5 段 cron（分 时 日 月 周），空字符串表示不注册该定时任务，非法表达式返回 400 invalid_setting；保存后立即重排，无需重启后端。
          properties:
            RANK_SCHEDULE_TIME: {type: string, example: '0 20 * * *', description: '榜单订阅定时任务，标准 5 段 cron（分 时 日 月 周）；空字符串清除即不注册该任务；非法表达式返回 400 invalid_setting；保存后立即重排，无需重启后端'}
            PAN115_EVENT_ENABLE: {type: string, enum: ['true', 'false', ''], description: '115 事件监听开关，默认关闭；Cookie 为空时强制保存为 false，包括仅清空 Cookie 的部分更新；保存后下一轮（正常 30 秒、失败 60 秒）生效。首次建立当前事件基线，重启续接成功游标，按全部 115 映射生成或更新 STRM，不删除旧文件。'}
            PAN115_COOKIE: {type: string, description: '115 Cookie，需包含有效 UID、CID、SEID 且不含换行；与 OpenAPI 绑定须为同一账号，加密保存，空字符串清除并强制关闭 PAN115_EVENT_ENABLE；需在 115 开启生活事件记录。可手动填写或用 POST /pan115/cookie/login/sessions 扫码获取。'}
            ACTOR_SCHEDULE_TIME: {type: string, example: '0 21 * * *', description: '演员订阅定时任务，标准 5 段 cron（分 时 日 月 周）；空字符串清除即不注册该任务；非法表达式返回 400 invalid_setting；保存后立即重排，无需重启后端'}
            TAG_SCHEDULE_TIME: {type: string, example: '30 21 * * *', description: '标签订阅定时任务，标准 5 段 cron（分 时 日 月 周）；空字符串清除即不注册该任务；非法表达式返回 400 invalid_setting；保存后立即重排，无需重启后端'}
            DOWNLOAD_SCHEDULE_TIME: {type: string, example: '0 22 * * *', description: '番号订阅定时任务，标准 5 段 cron（分 时 日 月 周），建议排在榜单与演员订阅之后；空字符串清除即不注册该任务；非法表达式返回 400 invalid_setting；保存后立即重排，无需重启后端'}
            BYPASS_USE_PROXY: {type: string, enum: ['true', 'false', ''], default: 'false', example: 'true', description: '是否向爬虫增强传递系统 PROXY；true 开启，false 或空字符串关闭。不提交保留原值，但 BYPASS_ENGINE 为空时强制保存 false。配置启动时读取，保存后需重启生效'}
