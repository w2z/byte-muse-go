    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 8
          maxLength: 256
        remember:
          type: boolean
          default: false
          description: 勾选“记住密码”时为 true，会话有效期由 1 天延长至 30 天；省略按 false 处理。
    LoginResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
        username:
          type: string
    Media:
      type: object
      required: [id, code, title, video_type, still_photos, subscription_status, library_status, display_status, created_at, updated_at]
      properties:
        video_type:
          type: [string, 'null']
          enum: [censored, uncensored, uncensored_cracked, leaked, null]
          description: 影片单值类型；censored 有码，uncensored 无码，uncensored_cracked 无码破解，leaked 流出；null 尚未分类，历史数据不推断回填
          example: censored
        id:
          type: string
        code:
          type: string
          description: 原始番号，保留数据源中的空格和大小写
        title:
          type: string
        translated_title:
          type: [string, 'null']
        poster_url:
          type: [string, 'null']
          format: uri
          description: 竖版或备用封面；banner_url 为空时用于卡片回退
        banner_url:
          type: [string, 'null']
          format: uri
          description: 横向大图，番号宫格优先展示该字段
        preview_url:
          type: [string, 'null']
          format: uri
          description: 预告视频地址；null 表示没有可播放预告
        still_photos:
          type: array
          description: 按数据源顺序排列的剧照地址；没有剧照时为空数组
          items:
            type: string
            format: uri
        release_date:
          type: [string, 'null']
          format: date
        duration_minutes:
          type: [integer, 'null']
          minimum: 0
        subscription_status:
          $ref: '#/components/schemas/SubscriptionStatus'
        library_status:
          $ref: '#/components/schemas/LibraryStatus'
        display_status:
          $ref: '#/components/schemas/MediaDisplayStatus'
        active_subscription:
          description: 当前活动订阅摘要；未订阅时为 null
          oneOf:
            - $ref: '#/components/schemas/SubscriptionSummary'
            - type: 'null'
        download_status:
          description: 最近下载任务状态；从未创建下载任务时为 null
          oneOf:
            - $ref: '#/components/schemas/DownloadStatus'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MediaPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Media'
    Actor:
      type: object
      required: [name, photo, limit_date]
      properties:
        name:
          type: string
          description: 演员名称，也是写接口中的稳定标识
        photo:
          type: [string, 'null']
          format: uri
          description: 演员头像地址；null 表示暂无头像
        limit_date:
          type: [string, 'null']
          format: date
          description: 订阅检索的最早发行日期；null 表示未订阅
    ActorSubscriptionRequest:
      type: object
      required: [limit_date]
      properties:
        limit_date:
          type: string
          format: date
          description: 订阅检索的最早发行日期，格式必须为 YYYY-MM-DD
    ActorPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Actor'
    Subscription:
      type: object
      required: [id, media_id, status, mode, filter, created_at, updated_at, version]
      properties:
        id:
          type: string
        media_id:
          type: string
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        mode:
          type: string
          enum: [strict, preload]
        filter:
          $ref: '#/components/schemas/SubscriptionFilter'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
          description: 乐观锁版本；每次编辑成功后加一，取消接口返回删除前的快照且不再持久化该记录
        media:
          description: 订阅列表内嵌的媒体卡片数据；单条写操作响应可省略
          $ref: '#/components/schemas/Media'
    SubscriptionSummary:
      type: object
      required: [id, media_id, status, mode, filter, created_at, updated_at, version]
      properties:
        id:
          type: string
        media_id:
          type: string
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        mode:
          type: string
          enum: [strict, preload]
        filter:
          $ref: '#/components/schemas/SubscriptionFilter'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    SubscriptionFilter:
      type: object
      description: 资源筛选规则；布尔字段省略时按 false，体积字段为 null 时不限制
      additionalProperties: true
      properties:
        only_chinese:
          type: boolean
          description: 仅选择带中文字幕的资源
        only_uc:
          type: boolean
          description: 仅选择无码资源
        exclude_uc:
          type: boolean
          description: 排除无码资源
        only_free:
          type: boolean
          description: 仅选择免费资源
        only_uhd:
          type: boolean
          description: 仅选择 UHD 资源
        exclude_uhd:
          type: boolean
          description: 排除 UHD 资源
        min_size:
          type: [number, 'null']
          minimum: 0
          description: 最小资源体积，单位 MB；null 表示不限制
        max_size:
          type: [number, 'null']
          minimum: 0
          description: 最大资源体积，单位 MB；null 表示不限制
    CreateSubscriptionRequest:
      type: object
      required: [media_id, mode]
      properties:
        media_id:
          type: string
        mode:
          type: string
          enum: [strict, preload]
          description: strict 为严格模式，preload 为预下载模式
        filter:
          $ref: '#/components/schemas/SubscriptionFilter'
          default: {}
    UpdateSubscriptionRequest:
      type: object
      required: [mode, filter, version]
      properties:
        mode:
          type: string
          enum: [strict, preload]
          description: strict 为严格模式，preload 为预下载模式
        filter:
          $ref: '#/components/schemas/SubscriptionFilter'
        version:
          type: integer
          minimum: 1
          description: 客户端最后读取到的订阅版本，过期时返回 409
    SubscriptionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Subscription'
    DownloadTask:
      type: object
      required: [id, media_id, status, created_at, updated_at]
      properties:
        id:
          type: string
        media_id:
          type: string
        status:
          $ref: '#/components/schemas/DownloadStatus'
        source_site:
          type: [string, 'null']
          description: 选中资源的站点名；尚未选中时为 null，BT 站显示 Nyaa BT
        source_kind:
          type: [string, 'null']
          enum: [pt, bt, null]
          description: 资源协议类别；尚未选中时为 null
        downloader:
          type: [string, 'null']
          description: 本次提交使用的下载器；尚未选中资源时为 null
        info_hash:
          type: [string, 'null']
          description: 选中种子的 40 位 info hash；用于下载器结果回查与去重
        transfer_status:
          type: [string, 'null']
          enum: [downloading, paused, failed, completed, null]
          description: 最近一次 qBittorrent 同步的传输状态；未同步为 null，不等于任务状态
        added_at:
          type: [string, 'null']
          description: 下载器加入时间，UTC RFC3339；尚未同步为 null
        completed_at:
          type: [string, 'null']
          description: 下载器完成时间，UTC RFC3339；未完成或尚未同步为 null
        external_id:
          type: [string, 'null']
        error_message:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DownloadPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/DownloadTask'
    ScheduledTask:
      type: object
      required: [name, cron, last_run, running]
      properties:
        name:
          type: string
          description: 定时任务名称
        cron:
          type: string
          description: 五段式 Cron 表达式
        last_run:
          type: [string, 'null']
          format: date-time
          description: 最近一次开始执行的时间；进程重启后为空
        running:
          type: boolean
          description: 当前是否正在执行
    ScheduledTaskPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ScheduledTask'
    LogRecord:
      type: object
      required: [time, level, category, message]
      properties:
        time:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warning, error]
        category:
          type: string
        message:
          type: string
        attrs:
          type: object
          description: 原样保存的附加字段，不进行敏感值脱敏
          additionalProperties: true
    LogPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/LogRecord'
    Dashboard:
      type: object
      required: [active_subscriptions, completed_downloads, media_count]
      properties:
        active_subscriptions:
          type: integer
        completed_downloads:
          type: integer
        media_count:
          type: integer
    SystemSettings:
      type: object
      required: [database_driver, values, configured]
      properties:
        database_driver:
          type: string
          enum: [sqlite, postgres, mysql]
          description: 数据库引擎，由部署环境管理，只读
        values:
          type: object
          additionalProperties:
            type: string
          description: >-
            设置值。键名与旧版 template.env、对标站 /config 一致；敏感值也会在已登录管理员会话中回显，
            按对标站设置页分组维护：站点、Emby、Plex、Jellyfin、微信、Telegram、Qbittorrent、
            Transmission、aria2、迅雷、CloudDrive2、过滤、排序、定时任务、翻译、Agent、其他。
            布尔取值固定为 true / false；数字为非负整数字符串；DEFAULT_FILTER 为过滤规则 JSON 字符串；
            DEFAULT_SORT 为逗号分隔的排序标签（uc、!uc、seeders、chinese、uhd、!uhd、site、free）；
            PTFANS_AUTH_TYPE、ROUSIPRO_AUTH_TYPE、NICEPT_AUTH_TYPE 为 key（密钥）或 cookie（Cookie），默认 key，空值使用密钥；
            PTFANS_API_KEY、ROUSIPRO_API_KEY、NICEPT_API_KEY 是分别加密保存的密钥，空值表示未配置；
            三站支持密钥分页搜索和种子下载；密钥与 Cookie 独立保存，切换模式不清除另一种凭据，密钥模式不回退 Cookie。
            PTTime 仅使用 PTT_COOKIE 搜索和下载，不使用受限 RSS。PTT_AUTH_TYPE、PTT_PASSKEY、PTT_UID 为兼容历史配置保留，运行时不读取，设置页不再提供。
            MAIN_SITE 取 ALL / 馒头 / BT / PTT / NicePT / PTFans / RousiPro；PTFANS_COOKIE 用于 PTFans 9KG 专区，ROUSIPRO_COOKIE 用于 RousiPro 9KG 目录，均为加密保存的管理员凭据，空值表示未配置；旧 ROUSI_COOKIE 不再显示或接受写入。IMAGE_MODE 取 INVISIBLE / VISIBLE / BLUR；PT_DEFAULT_DOWNLOADER 取 qbittorrent / transmission；BT_DEFAULT_DOWNLOADER 取 qbittorrent / transmission / aria2 / thunder（不含 CloudDrive2）；BYPASS_ENGINE 取 cloudflare_bypass_for_scraping / flaresolverr / scrapling，空值表示关闭；BYPASS_URL 为所选增强服务地址；LOG_RETENTION_DAYS 为日志保留天数，默认 30，0 或空值表示不自动删除；TRANSLATION_ENGINE 取 none / openai / google / baidu / deeplx；DEEPLX_URL 为 DeepLX 服务地址（例如 http://127.0.0.1:1188）；TRANSLATION_PROMPT 仅在 OpenAI 翻译时作为翻译 system prompt，留空使用内置提示词；AGENT_SYSTEM_PROMPT 仅用于 Telegram/Agent 对话，留空使用内置提示词。
          properties:
            PTT_AUTH_TYPE: {type: string, deprecated: true, enum: [key, cookie, ''], description: '历史兼容字段，不参与运行；PTTime 固定使用 PTT_COOKIE'}
            PTFANS_AUTH_TYPE: {type: string, enum: [key, cookie, ''], default: key, description: 'PTFans 鉴权方式；空值默认密钥'}
            ROUSIPRO_AUTH_TYPE: {type: string, enum: [key, cookie, ''], default: key, description: 'RousiPro 鉴权方式；空值默认密钥'}
            NICEPT_AUTH_TYPE: {type: string, enum: [key, cookie, ''], default: key, description: 'NicePT 鉴权方式；空值默认密钥'}
            PTT_PASSKEY: {type: string, deprecated: true, default: '', description: '历史兼容凭据，加密保留但不参与运行；空字符串清除'}
            PTT_UID: {type: string, deprecated: true, pattern: '^(|[0-9]*[1-9][0-9]*)$', default: '', description: '历史兼容 UID，不参与运行；空字符串未配置，不接受 0'}
            PTFANS_API_KEY: {type: string, default: '', description: 'PTFans 访问令牌；加密存储，空字符串清除，不是 Tracker PassKey'}
            ROUSIPRO_API_KEY: {type: string, default: '', description: 'RousiPro API Key；加密存储，空字符串清除'}
            NICEPT_API_KEY: {type: string, default: '', description: 'NicePT 访问令牌；加密存储，空字符串清除，不是 Tracker PassKey'}
        configured:
          type: object
          additionalProperties:
            type: boolean
          description: 敏感设置是否已经配置；与 values 中的敏感值配套，用于兼容客户端判断
    SystemSettingsUpdate:
      type: object
      required: [values]
      properties:
        values:
          type: object
          additionalProperties:
            type: string
          description: >-
            待保存的业务设置，只提交当前分组；页面应提交当前字段的完整值。普通字段和敏感字段的空值都会保存为空，
            用于显式清除配置；保存其他字段时不要提交未编辑的敏感字段。
            取值域与 SystemSettings.values 一致，越界或未声明的键返回 400 invalid_setting。
            站点模式与两种凭据可同时提交；只修改模式不应清空另一种凭据，显式提交空字符串才清除密钥或 Cookie。
          properties:
            PTT_AUTH_TYPE: {type: string, deprecated: true, enum: [key, cookie, ''], description: '历史兼容字段，不参与运行；PTTime 固定使用 PTT_COOKIE'}
            PTFANS_AUTH_TYPE: {type: string, enum: [key, cookie, ''], description: 'PTFans 鉴权方式；空值默认密钥'}
            ROUSIPRO_AUTH_TYPE: {type: string, enum: [key, cookie, ''], description: 'RousiPro 鉴权方式；空值默认密钥'}
            NICEPT_AUTH_TYPE: {type: string, enum: [key, cookie, ''], description: 'NicePT 鉴权方式；空值默认密钥'}
            PTT_PASSKEY: {type: string, deprecated: true, description: '历史兼容凭据，不参与运行；空字符串清除，不提交则保留原值'}
            PTT_UID: {type: string, deprecated: true, pattern: '^(|[0-9]*[1-9][0-9]*)$', description: '历史兼容 UID，不参与运行；空字符串未配置'}
            PTFANS_API_KEY: {type: string, description: 'PTFans 访问令牌；加密保存，空字符串清除；不提交则保留原值'}
            ROUSIPRO_API_KEY: {type: string, description: 'RousiPro API Key；加密保存，空字符串清除；不提交则保留原值'}
            NICEPT_API_KEY: {type: string, description: 'NicePT 访问令牌；加密保存，空字符串清除；不提交则保留原值'}
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    SubscriptionStatus:
      type: string
      enum: [none, active, canceled]
    DownloadStatus:
      type: string
      enum: [queued, searching, submitted, downloading, completed, failed, unknown]
    MediaDisplayStatus:
      type: string
      description: 卡片统一展示状态，由服务端按媒体库、下载任务和活动订阅的优先级计算
      enum: [unsubscribed, subscribed, downloading, completed, failed, unknown]
    LibraryStatus:
      type: string
      enum: [unknown, absent, present]
security:
  - sessionCookie: []
