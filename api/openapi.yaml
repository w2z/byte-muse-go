            ROUSIPRO_API_KEY: {type: string, description: 'RousiPro API Key；加密保存，空字符串清除；不提交则保留原值'}
            NICEPT_API_KEY: {type: string, description: 'NicePT 访问令牌；加密保存，空字符串清除；不提交则保留原值'}
            WECHAT_NOTIFY_SUBSCRIBE: {type: string, enum: ['true', 'false', ''], description: '微信订阅成功通知开关；true 开启，false 或空字符串关闭；不提交保留原值'}
