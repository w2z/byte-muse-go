            WECHAT_NOTIFY_DOWNLOAD_COMPLETE: {type: string, enum: ['true', 'false', ''], description: '微信下载完成通知开关；true 开启，false 或空字符串关闭；不提交保留原值'}
            WECHAT_NOTIFY_DOWNLOAD_FAILED: {type: string, enum: ['true', 'false', ''], description: '微信下载失败通知开关；true 开启，false 或空字符串关闭；不提交保留原值'}
            WECHAT_NOTIFY_AGENT_CHAT: {type: string, enum: ['true', 'false', ''], description: '微信 Agent 对话开关；true 开启，false 或空字符串关闭；不提交保留原值'}
            TELEGRAM_NOTIFY_SUBSCRIBE: {type: string, enum: ['true', 'false', ''], description: 'Telegram 订阅成功通知开关；true 开启，false 或空字符串关闭；不提交保留原值'}
            TELEGRAM_NOTIFY_SUBSCRIBE_FAILED: {type: string, enum: ['true', 'false', ''], description: 'Telegram 订阅失败通知开关；true 开启，false 或空字符串关闭；不提交保留原值'}
            TELEGRAM_NOTIFY_DOWNLOAD_START: {type: string, enum: ['true', 'false', ''], description: 'Telegram 开始下载通知开关；true 开启，false 或空字符串关闭；不提交保留原值'}
            TELEGRAM_NOTIFY_DOWNLOAD_COMPLETE: {type: string, enum: ['true', 'false', ''], description: 'Telegram 下载完成通知开关；true 开启，false 或空字符串关闭；不提交保留原值'}
            TELEGRAM_NOTIFY_DOWNLOAD_FAILED: {type: string, enum: ['true', 'false', ''], description: 'Telegram 下载失败通知开关；true 开启，false 或空字符串关闭；不提交保留原值'}
            TELEGRAM_NOTIFY_AGENT_CHAT: {type: string, enum: ['true', 'false', ''], description: 'Telegram Agent 对话开关；true 开启，false 或空字符串关闭；不提交保留原值'}
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ScanProgress:
      type: object
      description: 当前请求的动态文件处理进度；总数为已发现且符合过滤规则的媒体文件数，扫描时持续增加。仅 result 事件表示操作已返回结果，百分比 100 不代表全部成功。
      required: [phase, processed, total, percent, current]
      properties:
        phase: {type: string, enum: [waiting, discovering, processing, finalizing, completed], description: '阶段：等待、发现文件、处理文件、汇总或刷新、完成；completed 后仍须等待 result 事件'}
        processed: {type: integer, minimum: 0, description: '已处理文件数，包含成功、未变化、跳过及失败；目录读取失败时已发现但放弃的文件计入跳过处理'}
        total: {type: integer, minimum: 0, description: '本次扫描累计发现的符合规则文件数，初始为 0，随扫描动态增加；非预估总数'}
        percent: {type: integer, minimum: 0, maximum: 100, description: '向下取整的 processed / total × 100；总数增加时允许降低。total 为 0 时处理期间为 0，完成后为 100'}
        current: {type: string, description: '当前扫描目录或映射的展示路径；等待或完成时为空串'}
    ScanProgressEvent:
      type: object
      required: [type, progress]
      properties:
        type: {type: string, enum: [progress], description: 进度事件}
        progress: {$ref: '#/components/schemas/ScanProgress'}
    ScanErrorEvent:
      type: object
      required: [type, error]
      properties:
        type: {type: string, enum: [error], description: '流式失败终态；HTTP 头发送后错误通过此事件报告，不应仅判断 HTTP 200'}
        error: {$ref: '#/components/schemas/Error'}
    LibraryScanStreamEvent:
      description: 'NDJSON 每行一个事件。progress 可重复；最终返回 result 或 error。断开连接取消后续处理，已落库数据不回滚；无终态表示结果未确认，不自动重试。'
      oneOf:
        - {$ref: '#/components/schemas/ScanProgressEvent'}
        - {$ref: '#/components/schemas/ScanErrorEvent'}
        - type: object
          required: [type, result]
          properties:
            type: {type: string, enum: [result], description: '结果事件；应继续检查 directories[].message'}
            result: {$ref: '#/components/schemas/Pan115LibraryScanResult'}
    StrmScanStreamEvent:
      description: 'NDJSON 每行一个事件。progress 可重复；最终返回 result 或 error。断开连接取消后续处理，已生成文件不回滚；无终态表示结果未确认，不自动重试。'
      oneOf:
        - {$ref: '#/components/schemas/ScanProgressEvent'}
        - {$ref: '#/components/schemas/ScanErrorEvent'}
        - type: object
          required: [type, result]
          properties:
            type: {type: string, enum: [result], description: '结果事件；应继续检查 failed、mappings[].message 与 emby'}
            result: {$ref: '#/components/schemas/StrmScanResult'}
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    SubscriptionStatus:
      type: string
      enum: [none, active, canceled]
    DownloadStatus:
      type: string
      description: 下载任务状态；搜索没找到资源不会建立任务，因此新任务只从 unknown 开始，queued/searching 仅用于兼容历史数据
      enum: [queued, searching, submitted, downloading, completed, failed, unknown]
    MediaDisplayStatus:
      type: string
      description: 卡片统一展示状态，由服务端按媒体库、下载任务和活动订阅的优先级计算
      enum: [unsubscribed, subscribed, downloading, completed, failed, unknown]
    LibraryStatus:
      type: string
      enum: [unknown, absent, present]
    Pan115LoginSession:
      type: object
      required: [session_id, qr_code, expires_at]
      description: 一次扫码登录的启动结果；二维码 5 分钟内有效
      properties:
        session_id: {type: string, description: 会话标识，用于轮询扫码状态与主动取消}
        qr_code: {type: string, description: '可直接放入 img src 的 data:image/png;base64 二维码'}
        expires_at: {type: string, format: date-time, description: 二维码失效时间，为申请时刻起 5 分钟}
    Pan115LoginResult:
      type: object
      required: [status]
      description: 一次扫码状态查询结果；仅 authorized 携带账号快照
      properties:
        status: {type: string, enum: [waiting, scanned, authorized, expired, canceled], description: 'waiting 等待扫码；scanned 已扫码待确认；authorized 已授权并完成本地绑定；expired 二维码过期；canceled 用户取消'}
        account: {oneOf: [{$ref: '#/components/schemas/Pan115Account'}, {type: 'null'}], description: 授权后的账号快照；其他状态为 null}
    Pan115SpaceAmount:
      type: object
      required: [size, formatted]
      description: 单个容量数值
      properties:
        size: {type: integer, format: int64, description: 字节数；115 未返回该字段时为 0}
        formatted: {type: string, description: '115 提供的展示文本，例如 5.0TB；缺失时为空串'}
    Pan115CookieLoginSession:
      type: object
      required: [session_id, qr_code, client_type, expires_at]
      description: 一次 Cookie 扫码的启动结果；二维码 5 分钟内有效
      properties:
        session_id: {type: string, description: 会话标识，用于轮询扫码状态与主动取消}
        qr_code: {type: string, description: '可直接放入 img src 的 data:image/png;base64 二维码'}
        client_type: {type: string, enum: [alipaymini, wechatmini, 115android, 115ios, web, 115ipad, tv], description: 归一化后的扫码渠道；未知渠道回落到 alipaymini}
        expires_at: {type: string, format: date-time, description: 二维码失效时间，为申请时刻起 5 分钟}
    Pan115CookieLoginResult:
      type: object
      required: [status, cookie]
      description: 一次 Cookie 扫码状态查询结果；仅 authorized 携带 Cookie 明文
      properties:
        status: {type: string, enum: [waiting, scanned, authorized, expired, canceled], description: 'waiting 等待扫码；scanned 已扫码待确认；authorized 已授权并返回 Cookie；expired 二维码过期；canceled 用户取消'}
        cookie: {type: string, description: '授权后返回的 Cookie 明文，形如 UID=...; CID=...; SEID=...；其他状态为空串。仅在该次响应返回，前端应写入 PAN115_COOKIE 设置项'}
    Pan115Account:
      type: object
      required: [id, name, avatar, level, space, quota]
      description: 115 账号对外快照，只含展示字段，不含任何令牌
      properties:
        id: {type: string, description: 115 用户 ID}
        name: {type: string, description: 115 昵称}
        avatar: {type: string, description: 头像地址；缺失时为空串}
        level: {type: string, description: 会员等级展示文本；缺失时为空串}
        space:
          type: object
          required: [total, used, remaining]
          description: 容量快照
          properties:
            total: {$ref: '#/components/schemas/Pan115SpaceAmount'}
            used: {$ref: '#/components/schemas/Pan115SpaceAmount'}
            remaining: {$ref: '#/components/schemas/Pan115SpaceAmount'}
        quota: {oneOf: [{$ref: '#/components/schemas/Pan115Quota'}, {type: 'null'}], description: 云下载（离线下载）配额；115 未提供该数据时为 null，前端据此只把配额行替换为不可用提示}
    Pan115Quota:
      type: object
      required: [total, used, remaining]
      description: 云下载（离线下载）配额快照；115 以任务个数计量，三个字段都不是字节
      properties:
        total: {type: integer, description: 云下载配额总量，单位为任务个数}
        used: {type: integer, description: 已占用的云下载配额，单位为任务个数}
        remaining: {type: integer, description: 剩余的云下载配额，单位为任务个数}
    Pan115AccountResponse:
      type: object
      required: [linked]
      description: 当前 115 绑定状态
      properties:
        linked: {type: boolean, description: 是否已绑定 115 账号}
        account: {oneOf: [{$ref: '#/components/schemas/Pan115Account'}, {type: 'null'}], description: 已绑定时返回账号快照；未绑定为 null}
    Pan115Directory:
      type: object
      required: [id, name]
      description: 115 目录路径上的一级
      properties:
        id: {type: string, description: 目录 ID；根目录为 0}
        name: {type: string, description: '目录名称；根目录统一为“根目录”'}
    Pan115File:
      type: object
      required: [id, parent_id, name, is_directory, size, pick_code]
      description: 115 目录里的一个条目；pick_code 供后续播放直链使用，本身不含凭据
      properties:
        id: {type: string, description: 文件或目录 ID}
        parent_id: {type: string, description: 所属目录 ID}
        name: {type: string, description: 条目名称}
        is_directory: {type: boolean, description: 是否为目录}
        size: {type: integer, format: int64, description: 字节数；目录为 0}
        pick_code: {type: string, description: 115 提取码，用于生成播放直链；目录为空串}
    Pan115FilePage:
      type: object
      required: [directory_id, path, files, total, has_more]
      description: 一页 115 目录内容
      properties:
        directory_id: {type: string, description: 当前目录 ID；根目录为 0}
        path: {type: array, items: {$ref: '#/components/schemas/Pan115Directory'}, description: '根目录到当前目录的完整路径，由 115 列表响应直接返回；根目录为仅含“根目录”一项的数组'}
        files: {type: array, items: {$ref: '#/components/schemas/Pan115File'}, description: '当前页条目；无内容为空数组'}
        total: {type: integer, minimum: 0, description: 当前目录条目总数，取自 115 列表响应的 count}
        has_more: {type: boolean, description: 是否还有下一页}
    Pan115OfflineTask:
      type: object
      required: [hash, status, progress, file_id, directory_id]
      description: 115 离线任务的一次快照
      properties:
        hash: {type: string, description: 信息哈希}
        status: {type: integer, description: 115 原始任务状态码}
        progress: {type: integer, minimum: 0, maximum: 100, description: 归一化后的完成百分比}
        file_id: {type: string, description: 完成后在网盘中的文件 ID；未完成时为空串}
        directory_id: {type: string, description: 保存目录 ID}
    Pan115OfflinePage:
      type: object
      required: [page, page_count, tasks]
      description: 一页 115 离线任务
      properties:
        page: {type: integer, minimum: 1, description: 当前页码}
        page_count: {type: integer, minimum: 0, description: 总页数}
        tasks: {type: array, items: {$ref: '#/components/schemas/Pan115OfflineTask'}, description: '当前页任务；无任务为空数组'}
    Pan115OfflineTaskRequest:
      type: object
      required: [uri]
      description: 手动提交的 115 离线任务
      properties:
        uri: {type: string, description: 磁力链接或下载地址，去除首尾空格后必须非空}
        directory_id: {type: string, description: '保存目录 ID；省略或空串时使用设置中的「离线下载保存目录」，该设置也为空时保存到根目录'}
    Pan115LibraryDirectoryResult:
      type: object
      required: [id, path, files, matched, created, skipped, message]
      description: 单个 115 扫描目录的入库结果
      properties:
        id: {type: string, description: 115 目录 ID}
        path: {type: string, description: 选择目录时的展示用绝对路径}
        files: {type: integer, minimum: 0, description: 递归扫描到的视频文件数；只统计默认视频扩展名}
        matched: {type: integer, minimum: 0, description: '识别出番号的影片数；同番号在一个目录里只算一次'}
        created: {type: integer, minimum: 0, description: 本次新建的影片数；已存在的影片不计入}
        skipped: {type: integer, minimum: 0, description: 无法识别番号而跳过的文件数}
        message: {type: string, description: 该目录的错误说明；正常时为空串}
    Pan115LibraryScanResult:
      type: object
      required: [directories, files, matched, created, skipped]
      description: 一次「115 扫描目录 → 递归扫描 → 视频入库」的总结果
      properties:
        directories: {type: array, items: {$ref: '#/components/schemas/Pan115LibraryDirectoryResult'}, description: '各扫描目录的入库结果，顺序与 PAN115_SCAN_PATHS 一致'}
        files: {type: integer, minimum: 0, description: 全部目录扫描到的视频文件总数}
        matched: {type: integer, minimum: 0, description: 识别出番号的影片总数}
        created: {type: integer, minimum: 0, description: 本次新建的影片总数}
        skipped: {type: integer, minimum: 0, description: 无法识别番号而跳过的文件总数}
    StrmMapping:
      type: object
      required: [kind, id, path, local_path, formats]
      description: 一条「网盘目录 → 本地 strm 目录」映射，对应设置项 STRM_PATHS 的数组元素
      properties:
        kind: {type: string, enum: ['115', 'cd2'], description: '网盘类型；115 为 115 网盘，cd2 为 CloudDrive2，取值同时用作播放地址的路径段'}
        id: {type: string, description: '网盘目录标识，扫描与播放的权威依据；115 为目录 ID，CloudDrive2 为目录绝对路径'}
        path: {type: string, description: 网盘目录展示路径；只用于界面展示，不参与扫描与播放}
        local_path: {type: string, description: '本地 strm 目录，以 / 开头，相对固定 /strm 根目录；不能超出该根目录'}
        formats: {type: array, minItems: 1, items: {type: string, pattern: '^[a-z0-9][a-z0-9._-]*$'}, description: '该映射允许生成 STRM 的媒体格式；保存时转为小写并去除前导点。未提供时使用默认格式 mp4、avi、rmvb、wmv、mov、mkv、webm、iso、mpg、m4v、ts、flv、strm、vob、m2ts'}
        min_size_mb: {type: integer, minimum: 0, default: 0, description: '最小视频大小，单位 MB；小于该体积的视频不生成 strm。0 表示不限制；网盘未返回体积（size 为 0）的文件同样不受体积限制。负数返回 400 invalid_setting'}
        exclude:
          type: array
          description: '排除文件/夹规则列表；命中任一规则的文件夹或文件都跳过，不区分大小写。mode 决定匹配方式：equals 完整名称相等、prefix 前缀、suffix 后缀、contains 包含；因此完整文件夹名称、前缀、后缀与包含指定字符分别用四条规则表达。保存时去除 value 首尾空白、转为小写并去重，value 为空的规则被丢弃。命中文件夹时整个文件夹及其子目录都不生成 strm。空数组表示不排除任何名称'
          items:
            type: object
            required: [mode, value]
            properties:
              mode: {type: string, enum: [equals, prefix, suffix, contains], description: '匹配方式；equals 完整名称相等、prefix 前缀、suffix 后缀、contains 包含'}
              value: {type: string, description: '匹配内容；保存时去除首尾空白并转为小写，空值规则被丢弃'}
    StrmDirectory:
      type: object
      required: [name, path]
      description: 一个可选择的目录
      properties:
        name: {type: string, description: 目录名称}
        path: {type: string, description: '目录路径；本地 strm 目录相对固定 /strm 根目录，CloudDrive2 目录为网盘绝对路径'}
    StrmDirectoryPage:
      type: object
      required: [path, directories]
      description: 一次目录浏览结果；只包含子目录，不包含文件
      properties:
        path: {type: string, description: '当前目录路径；本地 strm 目录相对固定 /strm 根目录，CloudDrive2 目录为网盘绝对路径'}
        directories: {type: array, items: {$ref: '#/components/schemas/StrmDirectory'}, description: '当前目录的直接子目录；无子目录为空数组'}
    StrmScanMapping:
      type: object
      required: [kind, path, local_path, files, created, unchanged, failed, message]
      description: 单条映射的生成结果；message 为空串表示该映射没有可报告的问题
      properties:
        kind: {type: string, enum: ['115', 'cd2'], description: '网盘类型；115 为 115 网盘，cd2 为 CloudDrive2'}
        path: {type: string, description: 网盘目录展示路径}
        local_path: {type: string, description: 本地 strm 目录}
        files: {type: integer, minimum: 0, description: 该映射命中的媒体文件数；只统计媒体扩展名}
        created: {type: integer, minimum: 0, description: 本次新建的 strm 文件数}
        unchanged: {type: integer, minimum: 0, description: 内容一致、未改写磁盘的 strm 文件数}
        failed: {type: integer, minimum: 0, description: 写入失败的 strm 文件数}
        message: {type: string, description: 该映射的错误说明；正常时为空串}
    StrmEmbyResult:
      type: object
      required: [attempted, refreshed, message]
      description: 生成 strm 之后的 Emby 媒体库刷新结果
      properties:
        attempted: {type: boolean, description: '是否真的发起了刷新请求；未开启自动刷新或未配置 Emby 时为 false'}
        refreshed: {type: boolean, description: Emby 是否返回成功状态码}
        message: {type: string, description: 跳过或失败的原因；成功且无说明时为空串}
    StrmScanResult:
      type: object
      required: [mappings, files, created, failed, emby]
      description: 一次 strm 生成的总结果
      properties:
        mappings: {type: array, items: {$ref: '#/components/schemas/StrmScanMapping'}, description: '各条映射的生成结果，顺序与 STRM_PATHS 一致'}
        files: {type: integer, minimum: 0, description: 全部映射命中的媒体文件总数}
        created: {type: integer, minimum: 0, description: 本次新建的 strm 文件总数}
        failed: {type: integer, minimum: 0, description: 写入失败的 strm 文件总数}
        emby: {$ref: '#/components/schemas/StrmEmbyResult'}
security:
  - sessionCookie: []
