openapi: 3.1.0
info:
  title: ByteMuse API
  version: 0.1.0
  description: ByteMuse Go 第一阶段公开契约。所有时间均为 UTC RFC 3339。
servers:
  - url: /api/v1
paths:
  /tags: {"get":{"operationId":"listTags","summary":"查询标签目录","description":"只读聚合 legacy_media_metadata.genres。去除空标签，同一影片内重复标签只计一次；按关联影片数降序、名称升序排列。搜索为字面子串匹配。仅查询已存资料，不触发外站采集、全库影片匹配、追新订阅或下载；无数据返回空数组。标签名称按现有原文展示，不做跨语言合并。","parameters":[{"in":"cookie","name":"bytemuse_session","required":true,"description":"登录签发的 HttpOnly 会话 Cookie","schema":{"type":"string"}},{"in":"query","name":"page","description":"页码，从 1 开始","schema":{"type":"integer","minimum":1,"default":1}},{"in":"query","name":"page_size","description":"每页条数，最多 200","schema":{"type":"integer","minimum":1,"maximum":200,"default":15}},{"in":"query","name":"search","description":"标签名的字面子串；去掉首尾空格，省略或空串表示不限","schema":{"type":"string"}}],"responses":{"200":{"description":"标签分页目录；total 为匹配标签数，media_count 为关联影片数，不等同于媒体库已入库数量","content":{"application/json":{"schema":{"type":"object","required":["page","page_size","total","items"],"properties":{"page":{"type":"integer","description":"当前页码"},"page_size":{"type":"integer","description":"每页条数"},"total":{"type":"integer","description":"匹配标签总数"},"items":{"type":"array","description":"当前页标签；无结果为 []","items":{"type":"object","required":["name","media_count"],"properties":{"name":{"type":"string","description":"标签名称，去掉首尾空格，非空"},"media_count":{"type":"integer","minimum":1,"description":"去重关联影片数量"}}}}}},"example":{"page":1,"page_size":15,"total":1,"items":[{"name":"标签甲","media_count":3}]}}}},"400":{"description":"分页参数无效","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文错误说明"}}}}}},"401":{"description":"未登录或会话失效","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文错误说明"}}}}}},"500":{"description":"查询失败","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文错误说明"}}}}}},"503":{"description":"标签目录未就绪","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文错误说明"}}}}}}}}}
  /collection/sources: {"get":{"operationId":"listCollectionSources","summary":"查询采集来源能力","responses":{"200":{"description":"当前可调用的数据源能力；不代表外站实时可达","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/CollectionSource"}},"examples":{"sources":{"summary":"已实现来源列表","value":[{"id":"javdb","kinds":["search","rank"]},{"id":"netflav","kinds":["search","detail"]}]}}}}},"401":{"description":"未登录","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"稳定错误代码"},"message":{"type":"string","description":"中文错误说明"}}}}}},"503":{"description":"采集服务未装配","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"稳定错误代码"},"message":{"type":"string","description":"中文错误说明"}}}}}}},"description":" 必须携带登录接口签发的 bytemuse_session Cookie。","parameters":[{"in":"cookie","name":"bytemuse_session","required":true,"description":"登录签发的 HttpOnly 会话 Cookie，不在文档中填写真实值","schema":{"type":"string"}}]}}
  /collection/runs: {"post":{"operationId":"enqueueCollection","summary":"异步提交采集任务","description":"COLLECT-02：返回 202 仅表示持久化受理。JavDB 榜单自动采完所有分页；搜索和详情仅采指定页。每个视频独立事务保存，成功不会被其他视频失败回滚。翻译在独立后台任务执行，不触发订阅判断或下载。每阶段最多 3 次尝试，失败任务保留。完整非空且视频全部成功的榜单才切换，空结果及失败保留旧榜。通过 Location 或 GET /collection/runs/{runId} 查看实际进度。需要登录 Cookie。","parameters":[{"in":"cookie","name":"bytemuse_session","required":true,"description":"登录签发的 HttpOnly 会话 Cookie，不在文档中填写真实值","schema":{"type":"string"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CollectionRequest"},"example":{"source":"javdb","kind":"rank","period":"daily","page":1}}}},"responses":{"202":{"description":"已入队，未保证采集成功","headers":{"Location":{"description":"批次状态地址，包含 /api/v1","schema":{"type":"string"}}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CollectionRun"},"example":{"run_id":"0123456789abcdef0123456789abcdef","request":{"source":"javdb","kind":"rank","period":"daily","page":1},"status":"queued","crawl_status":"queued","pages":0,"discovered":0,"saved":0,"failed":0,"pending":0,"translated":0,"translation_failed":0,"translation_pending":0,"rank_published":false,"counts":{"fetched":0,"new":0,"existing":0,"inserted":0,"media_inserted":0,"actors_inserted":0},"created_at":"2026-09-28T02:00:00Z"}}}},"400":{"description":"来源、类型或参数无效","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文说明"}}}}}},"401":{"description":"未登录","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文说明"}}}}}},"500":{"description":"任务登记失败","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文说明"}}}}}},"503":{"description":"采集服务未装配","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文说明"}}}}}}}}}
  /collection/runs/{runId}: {"get":{"operationId":"getCollectionRun","summary":"查询异步采集批次进度","description":"只读查询持久化状态；单个视频失败不影响其他视频。未启用翻译时不创建翻译任务。错误代码不包含上游正文或凭据。","parameters":[{"in":"cookie","name":"bytemuse_session","required":true,"description":"登录签发的 HttpOnly 会话 Cookie，不在文档中填写真实值","schema":{"type":"string"}},{"in":"path","name":"runId","required":true,"schema":{"type":"string"},"description":"提交接口返回的 run_id"}],"responses":{"200":{"description":"当前各阶段状态及累计计数","content":{"application/json":{"schema":{"$ref":"#/components/schemas/CollectionRun"},"example":{"run_id":"0123456789abcdef0123456789abcdef","request":{"source":"javdb","kind":"rank","period":"daily","page":1},"status":"completed","crawl_status":"done","pages":2,"discovered":40,"saved":40,"failed":0,"pending":0,"translated":0,"translation_failed":0,"translation_pending":0,"rank_published":true,"counts":{"fetched":40,"new":40,"existing":0,"inserted":40,"media_inserted":40,"actors_inserted":0},"created_at":"2026-09-28T02:00:00Z"}}}},"401":{"description":"未登录","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文说明"}}}}}},"404":{"description":"批次不存在","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文说明"}}}}}},"500":{"description":"读取状态失败","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文说明"}}}}}},"503":{"description":"采集服务未装配","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文说明"}}}}}}}}}
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，响应同时设置 HttpOnly 会话 Cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      operationId: refreshSession
      security: []
      summary: 续签当前会话
      description: |
        不接收请求体，直接使用请求携带的 bytemuse_session Cookie 续签。
        会话仍有效、或过期未超过 24 小时宽限窗口时，下发新 Cookie 并把有效期续回满额
        （未勾选“记住密码”1 天，勾选后 30 天）；超出宽限窗口返回 401，前端需要跳转登录页。
      responses:
        '200':
          description: 续签成功，响应同时刷新 HttpOnly 会话 Cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      summary: 注销当前会话
      responses:
        '204':
          description: 已清除当前会话 Cookie
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dashboard:
    get:
      operationId: getDashboard
      responses:
        '200':
          description: 仪表盘汇总
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
  /media:
    get:
      operationId: listMedia
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          description: 按番号、原始标题或翻译标题模糊搜索
          schema:
            type: string
            maxLength: 100
        - name: query
          in: query
          description: 兼容旧客户端的搜索参数；与 search 二选一，search 优先
          schema:
            type: string
            maxLength: 100
        - name: subscription
          in: query
          description: 订阅状态筛选
          schema:
            $ref: '#/components/schemas/SubscriptionStatus'
        - name: subscription_status
          in: query
          description: 兼容旧客户端的订阅状态参数；与 subscription 二选一，subscription 优先
          schema:
            $ref: '#/components/schemas/SubscriptionStatus'
        - name: download
          in: query
          description: 最新下载任务状态筛选；没有下载任务时按 unknown 处理
          schema:
            $ref: '#/components/schemas/DownloadStatus'
        - name: library
          in: query
          description: 媒体库状态筛选
          schema:
            $ref: '#/components/schemas/LibraryStatus'
        - name: video_type
          in: query
          description: 影片类型单选；censored 有码，uncensored 无码，uncensored_cracked 无码破解，leaked 流出，unknown 未分类（数据库 NULL）；省略或空串不限，可与其他筛选组合，先筛选后分页
          schema:
            type: string
            enum: [censored, uncensored, uncensored_cracked, leaked, unknown]
      responses:
        '200':
          description: 影片分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
              example:
                page: 1
                page_size: 15
                total: 1
                items:
                  - id: example-media
                    code: TEST-001
                    title: 示例影片
                    video_type: censored
                    translated_title: null
                    still_photos: []
                    subscription_status: none
                    library_status: unknown
                    display_status: unsubscribed
                    active_subscription: null
                    download_status: null
                    created_at: '2026-09-28T00:00:00Z'
                    updated_at: '2026-09-28T00:00:00Z'
        '400':
          description: video_type 不在允许范围时返回 invalid_video_type
          content:
            application/json:
              example: {code: invalid_video_type, message: 影片类型无效}
  /media/{mediaId}:
    get:
      operationId: getMedia
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: 影片详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '404':
          $ref: '#/components/responses/NotFound'
  /ranks:
    get:
      operationId: listRanks
      summary: 查询榜单
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: type
          in: query
          description: 榜单类型；省略时使用 monthly
          schema:
            type: string
            enum: [daily, weekly, monthly]
            default: monthly
      responses:
        '200':
          description: 按数据库中榜单快照顺序返回媒体分页数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
  /codes/release_today:
    get:
      operationId: listReleaseToday
      summary: 查询今日上新
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 仅返回发布日期等于服务当前本地日期的数据库媒体分页数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
  /codes/recommend:
    get:
      operationId: listRecommendations
      summary: 查询推荐
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 根据数据库中的订阅、完成记录及媒体元数据计算的推荐分页数据；没有偏好数据时返回空列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
  /complex/search:
    get:
      operationId: searchCatalog
      summary: 综合搜索
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: 按番号、原始标题或翻译标题搜索；空值返回全部数据库媒体
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: 数据库搜索结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
  /actors:
    get:
      operationId: listActors
      summary: 查询演员列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: subscription
          in: query
          description: 演员列表页签；active 为已订阅，hot 为热门演员，all/none 保留兼容
          schema:
            type: string
            enum: [all, active, none, hot]
            default: active
        - name: keywords
          in: query
          description: 按演员名称进行包含匹配；为空时不筛选
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: 演员分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorPage'
  /actors/{actorName}/subscription:
    parameters:
      - name: actorName
        in: path
        required: true
        description: 演员名称，允许中文与空格，调用方须进行 URL 编码
        schema:
          type: string
          minLength: 1
    put:
      operationId: saveActorSubscription
      summary: 创建或编辑演员订阅
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorSubscriptionRequest'
      responses:
        '200':
          description: 已保存演员订阅限制日期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        '400':
          description: 日期不是 YYYY-MM-DD 格式
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: cancelActorSubscription
      summary: 取消演员订阅
      description: 仅清空演员的限制日期，保留演员资料，便于后续重新订阅。
      responses:
        '200':
          description: 已取消演员订阅，limit_date 返回 null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        '404':
          $ref: '#/components/responses/NotFound'
  /subscriptions:
    get:
      operationId: listSubscriptions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: 订阅列表状态；订阅页固定使用 active，取消后的记录不会返回
          schema:
            $ref: '#/components/schemas/SubscriptionStatus'
      responses:
        '200':
          description: 订阅分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPage'
    post:
      operationId: createSubscription
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '201':
          description: 已创建订阅
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '200':
          description: 幂等重放，返回已有订阅
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '409':
          description: 该番号已经存在活动订阅，不会重复添加；客户端应刷新列表并展示本地文件状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /subscriptions/{subscriptionId}/cancel:
    post:
      operationId: cancelSubscription
      summary: 删除订阅
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      responses:
        '200':
          description: 已删除订阅记录；媒体保留，排队或搜索中的下载任务删除，已提交任务保留
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '404':
          $ref: '#/components/responses/NotFound'
  /subscriptions/{subscriptionId}/download:
    post:
      operationId: enqueueSubscriptionDownload
      summary: 为活动订阅登记资源搜索与下载任务
      description: 重复请求返回已有任务；任务由后台处理。当前已验证的 BT 来源是 Nyaa BT（sukebei.nyaa.si）。
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      responses:
        '202':
          description: 已持久化任务；task_id 是下载任务标识，不表示下载器已受理
          content:
            application/json:
              schema:
                type: object
                required: [task_id]
                properties:
                  task_id:
                    type: string
                    description: 下载任务 ID，可在 GET /downloads 查询状态
              example:
                task_id: ABCDEFGHIJKLMNOPQRSTUVWXYZ
        '404':
          $ref: '#/components/responses/NotFound'
  /subscriptions/{subscriptionId}:
    put:
      operationId: updateSubscription
      summary: 编辑活动订阅
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionRequest'
      responses:
        '200':
          description: 已更新订阅，version 自增
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 版本已变化，或订阅记录已不存在而不能再编辑
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /downloads:
    get:
      operationId: listDownloads
      description: 按传输状态、加入时间和完成时间先过滤再分页；下载失败还包含搜索或提交阶段失败的任务，未同步字段为 null，不推断旧数据。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DownloadStatus'
        - name: transfer_status
          in: query
          description: qBittorrent 传输状态；failed 同时包含搜索或提交失败的任务；为空时不限，下载中不包含暂停、失败或完成
          schema: {type: string, enum: [downloading, paused, failed, completed]}
        - name: added_from
          in: query
          description: 加入时间下界，含该时刻，UTC RFC3339
          schema: {type: string, format: date-time}
        - name: added_to
          in: query
          description: 加入时间上界，不含该时刻，UTC RFC3339
          schema: {type: string, format: date-time}
        - name: completed_from
          in: query
          description: 下载完成时间下界，含该时刻，UTC RFC3339
          schema: {type: string, format: date-time}
        - name: completed_to
          in: query
          description: 下载完成时间上界，不含该时刻，UTC RFC3339
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: 下载任务分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadPage'
  /tasks:
    get:
      operationId: listScheduledTasks
      summary: 查询定时任务
      description: 返回调度器中已配置的后台定时任务、原始 Cron 表达式、最近执行时间和当前执行状态；该接口不是下载任务列表。
      parameters:
        - name: all
          in: query
          description: 设为 true 时返回全部定时任务，不分页；省略时使用分页参数。
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 定时任务列表；all=true 时返回全部任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledTaskPage'
  /tasks/{taskName}/run:
    post:
      operationId: runScheduledTask
      summary: 立即执行定时任务
      parameters:
        - name: taskName
          in: path
          required: true
          description: 定时任务名称
          schema:
            type: string
      responses:
        '202':
          description: 任务已开始执行
        '404':
          description: 定时任务不存在
        '409':
          description: 任务正在执行中
  /logs:
    get:
      operationId: listLogs
      summary: 查询持久化系统日志
      description: 查询数据库中持久化的系统日志；服务重启后日志仍然保留。
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: 日志每页条数；前端可选 100、200、300、400、500，默认 100。
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: level
          in: query
          schema:
            type: string
            enum: [debug, info, warning, error]
        - name: category
          in: query
          schema:
            type: string
            description: 日志业务分类
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
        - name: start_time
          in: query
          description: 按日志 logged_at 筛选的起始时间（包含），使用 RFC3339 格式。
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: 按日志 logged_at 筛选的结束时间（包含），使用 RFC3339 格式。
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 按时间倒序返回日志分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogPage'
        '400':
          description: 日志筛选参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 日志查询失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: clearLogs
      summary: 清空持久化系统日志
      description: 按 level、category、keyword、start_time、end_time 删除匹配日志；未提供筛选条件时删除全部日志，删除后无法恢复。
      parameters:
        - name: level
          in: query
          schema:
            type: string
            enum: [debug, info, warning, error]
        - name: category
          in: query
          schema:
            type: string
            description: 日志业务分类
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
        - name: start_time
          in: query
          description: 按日志 logged_at 筛选的起始时间（包含），使用 RFC3339 格式。
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: 按日志 logged_at 筛选的结束时间（包含），使用 RFC3339 格式。
          schema:
            type: string
            format: date-time
      responses:
        '204':
          description: 匹配的数据库系统日志已永久删除
        '400':
          description: 日志筛选参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 日志清空失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /system/settings:
    get:
      operationId: getSystemSettings
      description: 已登录管理员读取站点鉴权类型与独立凭据；PTFans、NicePT、RousiPro 支持密钥或 Cookie 搜索取种，PTTime 仅使用 Cookie。
      parameters:
        - {in: cookie, name: bytemuse_session, required: true, schema: {type: string}, description: 登录签发的管理员会话 Cookie，不在示例中填写真实值}
      responses:
        '200':
          description: 已登录管理员可读取的系统设置；敏感值在管理员设置表单中回显，请勿记录日志
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
              example:
                database_driver: sqlite
                values: {PTFANS_AUTH_TYPE: key, PTFANS_API_KEY: example-token, PTFANS_COOKIE: 'session=example'}
                configured: {PTFANS_API_KEY: true, PTFANS_COOKIE: true}
    put:
      operationId: updateSystemSettings
      description: 原子保存当前分组；密钥与 Cookie 分别加密保存，切换类型不清除隐藏凭据。
      parameters:
        - {in: cookie, name: bytemuse_session, required: true, schema: {type: string}, description: 登录签发的管理员会话 Cookie，不在示例中填写真实值}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemSettingsUpdate'
            example:
              values: {PTFANS_AUTH_TYPE: key, PTFANS_API_KEY: example-token, PTFANS_COOKIE: 'session=example'}
      responses:
        '200':
          description: 已保存并返回当前分组的完整系统设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
              example:
                database_driver: sqlite
                values: {PTFANS_AUTH_TYPE: key, PTFANS_API_KEY: example-token, PTFANS_COOKIE: 'session=example'}
                configured: {PTFANS_API_KEY: true, PTFANS_COOKIE: true}
        '400':
          description: 包含不支持的设置项或请求体无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /health/live:
    get:
      operationId: live
      security: []
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      operationId: ready
      security: []
      responses:
        '200':
          description: 数据库和迁移已就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: 服务未就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: bytemuse_session
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: 每页条数。上限与 application.MaxPageSize 一致，前端分页条的每页条数选项不会超过该值。
