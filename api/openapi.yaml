openapi: 3.1.0
info:
  title: ByteMuse API
  version: 0.1.0
  description: ByteMuse Go 第一阶段公开契约。所有时间均为 UTC RFC 3339。
servers:
  - url: /api/v1
paths:
  /tags: {"get":{"operationId":"listTags","summary":"查询标签目录","description":"查询源站字典与影片已有标签的并集，包含无关联影片的源站标签。按关联影片数降序、名称升序分页。未知分类返回未分类；名称保留原文。读取不触发采集、订阅或下载。","parameters":[{"in":"cookie","name":"bytemuse_session","required":true,"description":"登录签发的 HttpOnly 会话 Cookie","schema":{"type":"string"}},{"in":"query","name":"page","description":"页码，从 1 开始","schema":{"type":"integer","minimum":1,"default":1}},{"in":"query","name":"page_size","description":"每页条数，最多 500；全部标签页面可选 100、200、300、400、500，默认 100","schema":{"type":"integer","minimum":1,"maximum":500,"default":15}},{"in":"query","name":"search","description":"标签名的字面子串；去掉首尾空格，省略或空串表示不限","schema":{"type":"string"}},{"in":"query","name":"subscription","description":"all 全部（默认）、active 已订阅、none 未订阅","schema":{"type":"string","enum":["all","active","none"],"default":"all"}},{"in":"query","name":"category","description":"标签类型；省略或空串不限","schema":{"type":"string","enum":["主题","角色","服装","体型","行为","玩法","类别","未分类"]}}],"responses":{"200":{"description":"标签分页目录；total 为匹配标签数，media_count 为关联影片数，不等同于媒体库已入库数量","content":{"application/json":{"schema":{"type":"object","required":["page","page_size","total","items"],"properties":{"page":{"type":"integer","description":"当前页码"},"page_size":{"type":"integer","description":"每页条数"},"total":{"type":"integer","description":"匹配标签总数"},"items":{"type":"array","description":"当前页标签；无结果为 []","items":{"type":"object","required":["name","category","media_count","limit_date"],"properties":{"name":{"type":"string","description":"标签名称，去掉首尾空格，非空"},"media_count":{"type":"integer","minimum":0,"description":"去重关联影片数量"},"category":{"type":"string","enum":["主题","角色","服装","体型","行为","玩法","类别","未分类"],"description":"来源字典分类；无可靠映射为未分类"},"limit_date":{"type":"string","nullable":true,"format":"date","description":"追新起始日 YYYY-MM-DD，包含当天；null 表示未订阅"}}}}}},"example":{"page":1,"page_size":15,"total":1,"items":[{"name":"制服","category":"服装","media_count":3,"limit_date":"2026-09-28"}]}}}},"400":{"description":"分页、订阅状态或分类无效","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文错误说明"}}}}}},"401":{"description":"未登录或会话失效","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文错误说明"}}}}}},"500":{"description":"查询失败","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文错误说明"}}}}}},"503":{"description":"标签目录未就绪","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文错误说明"}}}}}}}}}
  /tags/{tagName}/subscription: {"put":{"operationId":"saveTagSubscription","summary":"创建或编辑标签订阅","description":"保存日期后匹配本地目录，含起始日；未知发行日期不匹配。自动创建 strict 影片订阅，下载仍由现有流程执行。已入库、有已提交或未知下载记录、已有活动订阅的影片不重复订阅。处理台账防止恢复用户取消的影片订阅。规则保存后若追新失败返回 500，规则仍保留，后续 TAG_SCHEDULE_TIME 任务继续。","parameters":[{"in":"cookie","name":"bytemuse_session","required":true,"description":"登录签发的 HttpOnly 会话 Cookie","schema":{"type":"string"}},{"in":"path","name":"tagName","required":true,"description":"完整标签名称，路径需 URL 编码","schema":{"type":"string"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["limit_date"],"properties":{"limit_date":{"type":"string","format":"date","description":"有效 YYYY-MM-DD 起始日期，不可空"}}},"example":{"limit_date":"2026-09-28"}}}},"responses":{"200":{"description":"保存后的标签状态","content":{"application/json":{"schema":{"type":"object","required":["name","category","media_count","limit_date"],"properties":{"name":{"type":"string","description":"标签名称，去掉首尾空格，非空"},"media_count":{"type":"integer","minimum":0,"description":"去重关联影片数量"},"category":{"type":"string","enum":["主题","角色","服装","体型","行为","玩法","类别","未分类"],"description":"来源字典分类；无可靠映射为未分类"},"limit_date":{"type":"string","nullable":true,"format":"date","description":"追新起始日 YYYY-MM-DD，包含当天；null 表示未订阅"}}},"example":{"name":"制服","category":"服装","media_count":3,"limit_date":"2026-09-28"}}}},"400":{"description":"请求体或限制日期无效","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文错误说明"}}}}}},"401":{"description":"未登录或会话失效","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文错误说明"}}}}}},"404":{"description":"标签不存在","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文错误说明"}}}}}},"500":{"description":"规则保存或追新失败；tag_follow_pending 表示规则已保存，可重试或等待后续任务","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文错误说明"}}}}}},"503":{"description":"标签目录未就绪","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文错误说明"}}}}}}}},"delete":{"operationId":"cancelTagSubscription","summary":"取消标签订阅","description":"幂等清空标签起始日期，停止追新，保留已有影片订阅、下载历史与处理台账。","parameters":[{"in":"cookie","name":"bytemuse_session","required":true,"description":"登录签发的 HttpOnly 会话 Cookie","schema":{"type":"string"}},{"in":"path","name":"tagName","required":true,"description":"完整标签名称，路径需 URL 编码","schema":{"type":"string"}}],"responses":{"200":{"description":"保存后的标签状态","content":{"application/json":{"schema":{"type":"object","required":["name","category","media_count","limit_date"],"properties":{"name":{"type":"string","description":"标签名称，去掉首尾空格，非空"},"media_count":{"type":"integer","minimum":0,"description":"去重关联影片数量"},"category":{"type":"string","enum":["主题","角色","服装","体型","行为","玩法","类别","未分类"],"description":"来源字典分类；无可靠映射为未分类"},"limit_date":{"type":"string","nullable":true,"format":"date","description":"追新起始日 YYYY-MM-DD，包含当天；null 表示未订阅"}}},"example":{"name":"制服","category":"服装","media_count":3,"limit_date":null}}}},"400":{"description":"请求参数无效","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文错误说明"}}}}}},"401":{"description":"未登录或会话失效","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文错误说明"}}}}}},"404":{"description":"标签不存在","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文错误说明"}}}}}},"500":{"description":"取消标签规则失败","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文错误说明"}}}}}},"503":{"description":"标签目录未就绪","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文错误说明"}}}}}}}}}
  /collection/sources: {"get":{"operationId":"listCollectionSources","summary":"查询采集来源能力","responses":{"200":{"description":"当前可调用的数据源能力；不代表外站实时可达","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/CollectionSource"}},"examples":{"sources":{"summary":"已实现来源列表","value":[{"id":"javdb","kinds":["search","detail","rank"]},{"id":"netflav","kinds":["search","detail"]},{"id":"javlibrary","kinds":["rank"]},{"id":"avbase","kinds":["search","actor"]},{"id":"jable","kinds":["search"]},{"id":"supjav","kinds":["search"]}]}}}}},"401":{"description":"未登录","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"稳定错误代码"},"message":{"type":"string","description":"中文错误说明"}}}}}},"503":{"description":"采集服务未装配","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"稳定错误代码"},"message":{"type":"string","description":"中文错误说明"}}}}}}},"description":"COLLECT-03：开放 JavDB search/detail/rank、Netflav search/detail、JavLibrary rank（仅 wanted 最想要榜）、AVBase search/actor（actor 为演员作品，query 传演员名）、Jable/SupJav search。仅开放已验证能力；JavBus 人工验证未通过、Avgle 不可用、ThisAV 明确排除。来源目录不是实时健康检测；访问失败明确报错，不当作空数据。需要登录 Cookie。","parameters":[{"in":"cookie","name":"bytemuse_session","required":true,"description":"登录签发的 HttpOnly 会话 Cookie，不在文档中填写真实值","schema":{"type":"string"}}]}}
  /collection/runs: {"post":{"operationId":"enqueueCollection","summary":"异步提交采集任务","description":"COLLECT-03：仅接受 /collection/sources 公布的来源和能力。JavDB 榜单周期 daily/weekly/monthly；JavLibrary 仅 wanted。返回 202 仅表示持久化受理。榜单自动采完所有分页；search/detail 仅采指定页，不自动展开详情。每个视频独立事务保存，成功不被其他视频失败回滚；无可靠番号只保存来源快照，不猜测关联影片。翻译在独立后台任务执行，不触发订阅判断或下载。每阶段最多 3 次尝试，失败任务保留。完整非空且视频全部成功的榜单才切换，空结果及失败保留旧榜，不同来源榜单互不覆盖。通过 Location 或 GET /collection/runs/{runId} 查看进度。需要登录 Cookie。","parameters":[{"in":"cookie","name":"bytemuse_session","required":true,"description":"登录签发的 HttpOnly 会话 Cookie，不在文档中填写真实值","schema":{"type":"string"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CollectionRequest"},"example":{"source":"javdb","kind":"rank","period":"daily","page":1}}}},"responses":{"202":{"description":"已入队，未保证采集成功","headers":{"Location":{"description":"批次状态地址，包含 /api/v1","schema":{"type":"string"}}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CollectionRun"},"example":{"run_id":"0123456789abcdef0123456789abcdef","request":{"source":"javdb","kind":"rank","period":"daily","page":1},"status":"queued","crawl_status":"queued","pages":0,"discovered":0,"saved":0,"failed":0,"pending":0,"translated":0,"translation_failed":0,"translation_pending":0,"rank_published":false,"counts":{"fetched":0,"new":0,"existing":0,"inserted":0,"media_inserted":0,"actors_inserted":0},"created_at":"2026-09-28T02:00:00Z"}}}},"400":{"description":"来源、类型或参数无效","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文说明"}}}}}},"401":{"description":"未登录","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文说明"}}}}}},"500":{"description":"任务登记失败","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文说明"}}}}}},"503":{"description":"采集服务未装配","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文说明"}}}}}}}}}
  /collection/runs/{runId}: {"get":{"operationId":"getCollectionRun","summary":"查询异步采集批次进度","description":"只读查询持久化状态；单个视频失败不影响其他视频。未启用翻译时不创建翻译任务。错误代码不包含上游正文或凭据。 CF 验证按 BYPASS_ENGINE/BYPASS_URL 尝试一次增强；普通 403、限流、登录页不自动增强。登录要求、增强失败与源站拒绝通过 error 区分。","parameters":[{"in":"cookie","name":"bytemuse_session","required":true,"description":"登录签发的 HttpOnly 会话 Cookie，不在文档中填写真实值","schema":{"type":"string"}},{"in":"path","name":"runId","required":true,"schema":{"type":"string"},"description":"提交接口返回的 run_id"}],"responses":{"200":{"description":"当前各阶段状态及累计计数","content":{"application/json":{"schema":{"$ref":"#/components/schemas/CollectionRun"},"example":{"run_id":"0123456789abcdef0123456789abcdef","request":{"source":"javdb","kind":"rank","period":"daily","page":1},"status":"completed","crawl_status":"done","pages":2,"discovered":40,"saved":40,"failed":0,"pending":0,"translated":0,"translation_failed":0,"translation_pending":0,"rank_published":true,"counts":{"fetched":40,"new":40,"existing":0,"inserted":40,"media_inserted":40,"actors_inserted":0},"created_at":"2026-09-28T02:00:00Z"}}}},"401":{"description":"未登录","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文说明"}}}}}},"404":{"description":"批次不存在","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文说明"}}}}}},"500":{"description":"读取状态失败","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文说明"}}}}}},"503":{"description":"采集服务未装配","content":{"application/json":{"schema":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string","description":"错误代码"},"message":{"type":"string","description":"中文说明"}}}}}}}}}
  /auth/login:
    post:
      operationId: login
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，响应同时设置 HttpOnly 会话 Cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      operationId: refreshSession
      security: []
      summary: 续签当前会话
      description: |
        不接收请求体，直接使用请求携带的 bytemuse_session Cookie 续签。
        会话仍有效、或过期未超过 24 小时宽限窗口时，下发新 Cookie 并把有效期续回满额
        （未勾选“记住密码”1 天，勾选后 30 天）；超出宽限窗口返回 401，前端需要跳转登录页。
      responses:
        '200':
          description: 续签成功，响应同时刷新 HttpOnly 会话 Cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      summary: 注销当前会话
      responses:
        '204':
          description: 已清除当前会话 Cookie
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dashboard:
    get:
      operationId: getDashboard
      summary: 查询仪表盘概览
      responses:
        '200':
          description: 仪表盘汇总
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
  /media:
    get:
      operationId: listMedia
      summary: 查询媒体库
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          description: 按番号、原始标题或翻译标题模糊搜索
          schema:
            type: string
            maxLength: 100
        - name: query
          in: query
          description: 兼容旧客户端的搜索参数；与 search 二选一，search 优先
          schema:
            type: string
            maxLength: 100
        - name: subscription
          in: query
          description: 订阅状态筛选
          schema:
            $ref: '#/components/schemas/SubscriptionStatus'
        - name: subscription_status
          in: query
          description: 兼容旧客户端的订阅状态参数；与 subscription 二选一，subscription 优先
          schema:
            $ref: '#/components/schemas/SubscriptionStatus'
        - name: download
          in: query
          description: 最新下载任务状态筛选；没有下载任务时按 unknown 处理
          schema:
            $ref: '#/components/schemas/DownloadStatus'
        - name: library
          in: query
          description: 媒体库状态筛选
          schema:
            $ref: '#/components/schemas/LibraryStatus'
        - name: video_type
          in: query
          description: 影片类型单选；censored 有码，uncensored 无码，uncensored_cracked 无码破解，leaked 流出，unknown 未分类（数据库 NULL）；省略或空串不限，可与其他筛选组合，先筛选后分页
          schema:
            type: string
            enum: [censored, uncensored, uncensored_cracked, leaked, unknown]
      responses:
        '200':
          description: 影片分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
              example:
                page: 1
                page_size: 15
                total: 1
                items:
                  - id: example-media
                    code: TEST-001
                    title: 示例影片
                    video_type: censored
                    translated_title: null
                    still_photos: []
                    subscription_status: none
                    library_status: unknown
                    display_status: unsubscribed
                    active_subscription: null
                    download_status: null
                    created_at: '2026-09-28T00:00:00Z'
                    updated_at: '2026-09-28T00:00:00Z'
        '400':
          description: video_type 不在允许范围时返回 invalid_video_type
          content:
            application/json:
              example: {code: invalid_video_type, message: 影片类型无效}
  /media/{mediaId}:
    get:
      operationId: getMedia
      summary: 查询影片完整资料
      description: 返回影片卡片及 details 扩展资料。演员、标签、制作商、发行商与系列读取已保存元数据；未采集字段返回 null，数组无数据返回空数组。订阅时间使用 active_subscription.created_at；原标题使用 title，展示标题优先 translated_title。不把当前翻译设置当作历史翻译引擎。
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: 影片详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '404':
          $ref: '#/components/responses/NotFound'
  /ranks:
    get:
      operationId: listRanks
      summary: 查询榜单
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: type
          in: query
          description: 榜单类型；省略时使用 monthly
          schema:
            type: string
            enum: [daily, weekly, monthly]
            default: monthly
      responses:
        '200':
          description: 按数据库中榜单快照顺序返回媒体分页数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
  /codes/release_today:
    get:
      operationId: listReleaseToday
      summary: 查询今日上新
      description: 仅查询数据库中发布日期等于服务当前本地日期的媒体，不注入 Mock 或演示数据。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 仅返回发布日期等于服务当前本地日期的数据库媒体分页数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
  /codes/recommend:
    get:
      operationId: listRecommendations
      summary: 查询推荐
      description: 使用已订阅、已完成或已入库媒体建立偏好画像，对发行日期处于前后一个月窗口内的未订阅媒体打分：标签 ×1、演员 ×5（仅候选影片演员数不超过 3 时计入）、系列 ×2、厂牌 ×2，每个维度取出现次数最多的前 10 个值参与加权；仅返回得分大于 0 的结果，按得分、发行日期降序、内部 ID 升序排列。没有偏好数据时返回空列表，不注入 Mock 或演示数据。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 根据数据库中的订阅、完成记录及媒体元数据计算的推荐分页数据；没有偏好数据时返回空列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
  /complex/search: {"get":{"operationId":"searchCatalog","summary":"综合搜索","parameters":[{"name":"tag","in":"query","description":"完整标签名称精确匹配；非空时优先于 q，结果由服务端分页，不触发外站采集","schema":{"type":"string"}},{"$ref":"#/components/parameters/Page"},{"$ref":"#/components/parameters/PageSize"},{"name":"q","in":"query","description":"按番号、原始标题或翻译标题搜索；空值返回全部数据库媒体","schema":{"type":"string","maxLength":100}},{"in":"cookie","name":"bytemuse_session","required":true,"description":"登录会话 Cookie","schema":{"type":"string"}}],"responses":{"200":{"description":"数据库搜索结果","content":{"application/json":{"schema":{"$ref":"#/components/schemas/MediaPage"},"example":{"page":1,"page_size":15,"total":0,"items":[]}}}}}}}
  /actors:
    get:
      operationId: listActors
      summary: 查询演员列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: subscription
          in: query
          description: 演员列表页签；all 为系统全部演员（含 gfriends 目录），active 为已订阅，hot 仅为热门演员榜，none 为未订阅
          schema:
            type: string
            enum: [all, active, none, hot]
            default: active
        - name: keywords
          in: query
          description: 按演员名称或 gfriends 别名进行包含匹配；为空时不筛选
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: 演员分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorPage'
  /actors/{actorName}/subscription:
    parameters:
      - name: actorName
        in: path
        required: true
        description: 演员名称，允许中文与空格，调用方须进行 URL 编码
        schema:
          type: string
          minLength: 1
    put:
      operationId: saveActorSubscription
      summary: 创建或编辑演员订阅
      description: 保存日期后匹配本地已入库影片并自动建立 strict 影片订阅：仅订阅发行日期严格晚于截止日期、番号不含 VR、演员数不超过 MAX_ACTOR、且未在库或已有活动订阅/下载记录的影片。处理台账防止恢复用户取消的影片订阅。规则保存后若追新失败返回 500，规则仍保留，后续 ACTOR_SCHEDULE_TIME 任务继续；该任务同时按已订阅演员入队 AVBase 演员作品采集。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorSubscriptionRequest'
      responses:
        '200':
          description: 已保存演员订阅限制日期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        '500':
          description: 演员规则已保存但追新未完成（actor_follow_pending）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: 日期不是 YYYY-MM-DD 格式
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: cancelActorSubscription
      summary: 取消演员订阅
      description: 仅清空演员的限制日期，保留演员资料，便于后续重新订阅。
      responses:
        '200':
          description: 已取消演员订阅，limit_date 返回 null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        '404':
          $ref: '#/components/responses/NotFound'
  /subscriptions:
    get:
      operationId: listSubscriptions
      summary: 查询订阅列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: 订阅列表状态；订阅页固定使用 active，取消后的记录不会返回
          schema:
            $ref: '#/components/schemas/SubscriptionStatus'
      responses:
        '200':
          description: 订阅分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPage'
    post:
      operationId: createSubscription
      summary: 创建订阅
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '201':
          description: 已创建订阅
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '200':
          description: 幂等重放，返回已有订阅
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '409':
          description: 该番号已经存在活动订阅，不会重复添加；客户端应刷新列表并展示本地文件状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /subscriptions/{subscriptionId}/cancel:
    post:
      operationId: cancelSubscription
      summary: 删除订阅
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      responses:
        '200':
          description: 已删除订阅记录；媒体保留，排队或搜索中的下载任务删除，已提交任务保留
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '404':
          $ref: '#/components/responses/NotFound'
  /subscriptions/{subscriptionId}/download:
    post:
      operationId: enqueueSubscriptionDownload
      summary: 为活动订阅登记一次资源搜索
      description: 为活动订阅登记一次资源搜索，由后台搜索 PT（已接入馒头）和 Nyaa BT（sukebei.nyaa.si）资源；只有选中资源才会建立下载任务。搜索没找到资源属于正常结果，不建立下载任务，等下一次排期重新搜索。重复请求返回同一标识；202 只表示已受理搜索，不代表已找到资源或下载器已受理。需要登录。
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      responses:
        '202':
          description: 已受理搜索；task_id 是本次请求的持久化标识（已有下载任务时即该任务 ID，否则为搜索队列 ID），不表示已找到资源或下载器已受理
          content:
            application/json:
              schema:
                type: object
                required: [task_id]
                properties:
                  task_id:
                    type: string
                    description: 本次请求的持久化标识；已有下载任务时为该任务 ID（可在 GET /downloads 查询），否则为搜索队列 ID，搜索有结果后会建立新的下载任务
              example:
                task_id: ABCDEFGHIJKLMNOPQRSTUVWXYZ
        '404':
          $ref: '#/components/responses/NotFound'
  /subscriptions/{subscriptionId}:
    put:
      operationId: updateSubscription
      summary: 编辑活动订阅
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionRequest'
      responses:
        '200':
          description: 已更新订阅，version 自增
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 版本已变化，或订阅记录已不存在而不能再编辑
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /downloads:
    get:
      operationId: listDownloads
      summary: 查询下载任务
      description: 按传输状态、加入时间和完成时间先过滤再分页；code 为关联影片番号，关联缺失为 null；available_actions 根据状态和下载器能力返回。qB 4.x 支持暂停，5.x 使用停止；能力读取失败不提供外部控制操作。失败筛选包含搜索失败，不推断旧数据。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DownloadStatus'
        - name: transfer_status
          in: query
          description: qBittorrent 传输状态；failed 同时包含搜索或提交失败的任务；为空时不限，下载中不包含暂停、失败或完成
          schema: {type: string, enum: [downloading, paused, stopped, failed, completed]}
        - name: added_from
          in: query
          description: 加入时间下界，含该时刻，UTC RFC3339
          schema: {type: string, format: date-time}
        - name: added_to
          in: query
          description: 加入时间上界，不含该时刻，UTC RFC3339
          schema: {type: string, format: date-time}
        - name: completed_from
          in: query
          description: 下载完成时间下界，含该时刻，UTC RFC3339
          schema: {type: string, format: date-time}
        - name: completed_to
          in: query
          description: 下载完成时间上界，不含该时刻，UTC RFC3339
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: 下载任务分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadPage'
  /downloads/{taskId}/{action}:
    post:
      operationId: controlDownload
      summary: 控制下载任务
      description: 按当前状态和下载器版本校验后执行一次并回查。pause 暂停、stop 停止、resume 继续、retry 重试；搜索失败重试复用任务入队且要求活动订阅，无重复有效任务；传输失败重试启动原外部任务。结果不确定不重投，返回 502 后刷新核实。需要登录 Cookie。
      parameters:
        - {name: taskId, in: path, required: true, description: 下载任务 ID, schema: {type: string}}
        - {name: action, in: path, required: true, description: 操作类型；以 available_actions 为准, schema: {type: string, enum: [pause, stop, resume, retry]}}
      responses:
        '204': {description: 操作已核实；搜索重试表示重新排队，不保证下载成功}
        '400': {description: 操作名称无效}
        '401': {description: 未登录或会话失效}
        '404': {description: 下载任务不存在}
        '409': {description: 状态变化、正在操作、订阅失效或下载器不支持操作}
        '502': {description: 下载器调用或结果回查失败，不自动重复执行}
        '503': {description: 下载服务未就绪}
  /downloads/{taskId}:
    delete:
      operationId: deleteDownload
      summary: 删除下载任务
      description: 默认只删除任务保留文件；delete_files=true 同时请求下载器删除文件且不可恢复，失败任务禁止此模式。外部任务移除回查通过后才删除本地任务；任务不存在可收敛清理，不删除影片或订阅。文件移除由下载器执行，不保证文件系统物理擦除。需要登录 Cookie。
      parameters:
        - {name: taskId, in: path, required: true, description: 下载任务 ID, schema: {type: string}}
        - {name: delete_files, in: query, description: 是否同时删除文件；省略或 false 保留文件，true 删除文件；失败任务只允许 false, schema: {type: boolean, default: false}}
      responses:
        '204': {description: 外部任务已移除且本地记录已删除，或无外部任务的失败记录已删除}
        '400': {description: delete_files 不是 true 或 false}
        '401': {description: 未登录或会话失效}
        '404': {description: 下载任务不存在}
        '409': {description: 状态冲突或不支持所选删除方式}
        '502': {description: 下载器删除结果未确认，本地记录保留}
        '503': {description: 下载服务未就绪}
  /tasks:
    get:
      operationId: listScheduledTasks
      summary: 查询定时任务
      description: 返回调度器中已配置的后台定时任务、原始 Cron 表达式、最近执行时间和当前执行状态；该接口不是下载任务列表。同步热门演员按 ACTOR_SCHEDULE_TIME 执行热门演员月榜并继续订阅追新；同步演员目录固定每天 04:00 执行 gfriends 目录导入。演员目录任务失败不会清空已有演员或热门榜。
      parameters:
        - name: all
          in: query
          description: 设为 true 时返回全部定时任务，不分页；省略时使用分页参数。
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 定时任务列表；all=true 时返回全部任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledTaskPage'
  /tasks/{taskName}/run:
    post:
      operationId: runScheduledTask
      summary: 立即执行定时任务
      parameters:
        - name: taskName
          in: path
          required: true
          description: 定时任务名称
          schema:
            type: string
      responses:
        '202':
          description: 任务已开始执行
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string, description: 固定为“任务已开始执行”}
              example: {message: 任务已开始执行}
        '400':
          description: 任务名称无效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: 定时任务不存在
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 任务正在执行中
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: 调度器尚未就绪
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /logs:
    get:
      operationId: listLogs
      summary: 查询持久化系统日志
      description: 查询数据库中持久化的系统日志，支持分页、分类、级别、关键词和时间段筛选；服务重启后日志仍然保留。附加字段按原值保存，不进行敏感值脱敏。
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: 日志每页条数；前端可选 100、200、300、400、500，默认 100。
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: level
          in: query
          schema:
            type: string
            enum: [debug, info, warning, error]
        - name: category
          in: query
          schema:
            type: string
            description: 日志业务分类
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
        - name: start_time
          in: query
          description: 按日志 logged_at 筛选的起始时间（包含），使用 RFC3339 格式。
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: 按日志 logged_at 筛选的结束时间（包含），使用 RFC3339 格式。
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 按时间倒序返回日志分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogPage'
        '400':
          description: 日志筛选参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 日志查询失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: clearLogs
      summary: 清空持久化系统日志
      description: 按 level、category、keyword、start_time、end_time 删除匹配日志；未提供筛选条件时删除全部日志，删除后无法恢复。
      parameters:
        - name: level
          in: query
          schema:
            type: string
            enum: [debug, info, warning, error]
        - name: category
          in: query
          schema:
            type: string
            description: 日志业务分类
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
        - name: start_time
          in: query
          description: 按日志 logged_at 筛选的起始时间（包含），使用 RFC3339 格式。
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: 按日志 logged_at 筛选的结束时间（包含），使用 RFC3339 格式。
          schema:
            type: string
            format: date-time
      responses:
        '204':
          description: 匹配的数据库系统日志已永久删除
        '400':
          description: 日志筛选参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 日志清空失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /system/settings:
    get:
      operationId: getSystemSettings
      summary: 读取系统设置
      description: 已登录管理员读取站点鉴权类型与独立凭据；PTFans、NicePT、RousiPro 支持密钥或 Cookie 搜索取种，PTTime 仅使用 Cookie。
      parameters:
        - {in: cookie, name: bytemuse_session, required: true, schema: {type: string}, description: 登录签发的管理员会话 Cookie，不在示例中填写真实值}
      responses:
        '200':
          description: 已登录管理员可读取的系统设置；敏感值在管理员设置表单中回显，请勿记录日志
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
              example:
                database_driver: sqlite
                values: {PTFANS_AUTH_TYPE: key, PTFANS_API_KEY: example-token, PTFANS_COOKIE: 'session=example'}
                configured: {PTFANS_API_KEY: true, PTFANS_COOKIE: true}
    put:
      operationId: updateSystemSettings
      summary: 保存系统设置
      description: 原子保存当前分组；密钥与 Cookie 分别加密保存，切换类型不清除隐藏凭据。AGENT_SYSTEM_PROMPT 和 TRANSLATION_PROMPT 各允许最多 61440 个 UTF-8 字节，其他值最多 8192 字节；按去除首尾空白前的输入计算，超限返回 400 invalid_setting，message 包含字段名、字节上限和当前字节数，整批不写入且不截断。本地 strm 根目录固定为 /strm，不接受 STRM_ROOT 配置；STRM_PATHS 中每项的 min_size_mb 不能为负数，exclude 的 mode 必须是 equals / prefix / suffix / contains，value 保存时去除首尾空白、转为小写并去重，空 value 规则被丢弃；PAN115_COOKIE 为空字符串时同一批请求强制把 PAN115_EVENT_ENABLE 保存为 false。
      parameters:
        - {in: cookie, name: bytemuse_session, required: true, schema: {type: string}, description: 登录签发的管理员会话 Cookie，不在示例中填写真实值}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemSettingsUpdate'
            example:
              values: {PTFANS_AUTH_TYPE: key, PTFANS_API_KEY: example-token, PTFANS_COOKIE: 'session=example'}
      responses:
        '200':
          description: 已保存并返回当前分组的完整系统设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
              example:
                database_driver: sqlite
                values: {PTFANS_AUTH_TYPE: key, PTFANS_API_KEY: example-token, PTFANS_COOKIE: 'session=example'}
                configured: {PTFANS_API_KEY: true, PTFANS_COOKIE: true}
        '400':
          description: 包含不支持的设置项或请求体无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /system/settings/openai/test:
    post:
      operationId: testOpenAI
      summary: 测试 OpenAI 连接
      description: 使用当前表单草稿发起一次简短 chat/completions 请求，收到非空回复才成功。无需保存或启用 Agent，不读写设置，不返回模型原文或密钥；30 秒超时，不重试，不跟随重定向。配置或请求体错误返回 400，上游鉴权、额度、模型、超时、网络与响应校验失败统一返回 502，失败原因均为本地生成的脱敏中文说明。
      parameters:
        - {in: cookie, name: bytemuse_session, required: true, schema: {type: string}, description: 登录签发的管理员会话 Cookie}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, model, api_key]
              properties:
                url: {type: string, description: 'OpenAI 兼容基址，例如 https://api.openai.com/v1；自动追加 /chat/completions。仅限 HTTP/HTTPS，不允许用户信息、查询参数或片段；非空且不接受 null。'}
                model: {type: string, description: 模型名称，去除首尾空格后必须非空，不接受 null}
                api_key: {type: string, description: 本次测试的 API Key，非空且不接受 null，仅用于本次请求，不持久化或回显}
            example: {url: 'https://api.openai.com/v1', model: gpt-4o-mini, api_key: example-key}
      responses:
        '200':
          description: 模型返回有效的非空对话回复
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string, description: '用于 Message 显示的成功提示，格式 OpenAI 连接成功 (892ms)，数字为本次后端实际处理耗时'}
              example: {message: OpenAI 连接成功 (892ms)}
        '400':
          description: 请求体错误或地址、模型、密钥缺失或无效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '502':
          description: '上游鉴权、额度、网络、超时或响应校验失败；message 格式 OpenAI 连接失败 (892ms)：失败原因，数字为本次后端实际处理耗时；原因仅使用本地生成的脱敏中文说明'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: openai_test_failed, message: 'OpenAI 连接失败 (892ms)：鉴权失败（HTTP 401），请检查 API Key 和模型权限'}
  /system/version:
    get:
      operationId: getSystemVersion
      summary: 读取当前版本与发布仓库版本
      description: 返回当前运行版本与发布仓库 version.json 记录的版本，供顶栏版本标签显示与升级提示。当前版本来自 BYTEMUSE_VERSION，未注入时为 dev。服务端按 1 小时缓存成功结果、1 分钟缓存失败结果，避免耗尽 GitHub 未认证额度。远端检查失败不影响本接口：仍返回 200，失败原因放在 check_error。版本按点分数字段比较，dev 或非数字版本不判定升级。
      parameters:
        - {in: cookie, name: bytemuse_session, required: true, schema: {type: string}, description: 登录签发的管理员会话 Cookie，不在示例中填写真实值}
      responses:
        '200':
          description: 当前版本与远端版本的比较结果；check_error 非空表示本次远端检查失败，此时 latest 与 release_url 为空串、has_update 为 false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemVersion'
              example: {current: 0.1.21, latest: 0.1.22, has_update: true, release_url: 'https://github.com/w2z/byte-muse-go', checked_at: '2026-09-29T12:00:00Z', check_error: ''}
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: 版本检查未装配发布源
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: service_unavailable, message: 版本检查未就绪}
  /pan115/login/sessions:
    post:
      operationId: startPan115Login
      summary: 申请 115 扫码登录
      description: 向 115 申请设备码并返回可直接渲染的二维码 PNG data URL。二维码 5 分钟内有效；服务端内存中同时最多保留 32 个扫码会话，超出时淘汰最早的一个。设备码与 PKCE 校验值只存在于内存，不落库也不返回，因此二维码会话不是可重放的凭据。需要登录会话。
      parameters:
        - {in: cookie, name: bytemuse_session, required: true, schema: {type: string}, description: 登录签发的管理员会话 Cookie，不在示例中填写真实值}
      responses:
        '201':
          description: 已创建扫码会话；session_id 用于轮询状态与主动取消
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pan115LoginSession'}
              example: {session_id: 3f1c2f9d8b7a6c5e4d3b2a1908172635445566778899aabbccddeeff00112233, qr_code: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGQAAABkCAYAAABw4pVUAAAA', expires_at: '2026-09-29T10:05:00Z'}
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '502':
          description: '115 返回错误或暂时不可用；message 为本地生成的脱敏中文说明'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: pan115_unavailable, message: 115 网盘暂时不可用，请稍后重试}
        '503':
          description: 115 网盘服务未装配
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /pan115/login/sessions/{sessionId}:
    get:
      operationId: getPan115LoginStatus
      summary: 查询 115 扫码状态
      description: 轮询扫码状态。首次返回 authorized 时立即用设备码换取令牌、读取账号快照并加密落库，之后重复查询返回同一账号快照。会话不存在、已消费或已被清理返回 404，前端应重新申请二维码。
      parameters:
        - {in: cookie, name: bytemuse_session, required: true, schema: {type: string}, description: 登录签发的管理员会话 Cookie}
        - {in: path, name: sessionId, required: true, schema: {type: string}, description: 申请接口返回的 session_id}
      responses:
        '200':
          description: 当前扫码状态；authorized 时附带账号快照
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pan115LoginResult'}
              example: {status: authorized, account: {id: '12345678', name: 115 用户, avatar: 'https://example.com/avatar.png', level: VIP, space: {total: {size: 5497558138880, formatted: 5.0TB}, used: {size: 1099511627776, formatted: 1.0TB}, remaining: {size: 4398046511104, formatted: 4.0TB}}}}
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: 扫码会话不存在或已过期，请重新获取二维码
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: pan115_login_unknown, message: 115 扫码会话不存在或已过期，请重新获取二维码}
        '502':
          description: '115 返回错误或暂时不可用；message 为本地生成的脱敏中文说明'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: 115 网盘服务未装配
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    delete:
      operationId: cancelPan115Login
      summary: 取消 115 扫码会话
      description: 结束一次扫码会话，使二维码立即失效，避免页面关闭后仍可被扫描。会话不存在时同样返回 204。
      parameters:
        - {in: cookie, name: bytemuse_session, required: true, schema: {type: string}, description: 登录签发的管理员会话 Cookie}
        - {in: path, name: sessionId, required: true, schema: {type: string}, description: 申请接口返回的 session_id}
      responses:
        '204':
          description: 会话已结束；重复取消同样返回 204
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /pan115/cookie/login/sessions:
    post:
      operationId: startPan115CookieLogin
      summary: 申请 115 扫码获取 Cookie
      description: '按渠道申请一次扫码会话，返回可直接渲染的二维码 PNG data URL；渠道取 alipaymini（支付宝小程序）、wechatmini（微信小程序）、115android（安卓 App）、115ios（iOS App）、web（网页版）、115ipad（iPad）、tv（TV），默认 alipaymini。二维码与状态查询固定走 115 web 入口，渠道只决定最终换取哪个客户端的 Cookie。请求体可省略或用空对象表示默认渠道；未知渠道按默认渠道处理，不返回 400。二维码 5 分钟内有效，服务端内存中同时最多保留 32 个扫码会话，超出时淘汰最早的一个。uid/time/sign 只存在于内存，不落库也不返回。需要登录会话。'
      parameters:
        - {in: cookie, name: bytemuse_session, required: true, schema: {type: string}, description: 登录签发的管理员会话 Cookie}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                client_type: {type: string, enum: [alipaymini, wechatmini, 115android, 115ios, web, 115ipad, tv], description: 扫码渠道；缺省或未知值使用 alipaymini}
            example: {client_type: alipaymini}
      responses:
        '201':
          description: 已创建扫码会话；client_type 为归一化后的渠道
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pan115CookieLoginSession'}
              example: {session_id: 3f1c2f9d8b7a6c5e4d3b2a1908172635445566778899aabbccddeeff00112233, qr_code: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGQAAABkCAYAAABw4pVUAAAA', client_type: alipaymini, expires_at: '2026-09-29T10:05:00Z'}
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '502':
          description: '115 返回错误或暂时不可用；message 为本地生成的脱敏中文说明'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: pan115_unavailable, message: 115 网盘暂时不可用，请稍后重试}
        '503':
          description: 115 网盘服务未装配
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /pan115/cookie/login/sessions/{sessionId}:
    get:
      operationId: getPan115CookieLoginStatus
      summary: 查询 115 扫码获取 Cookie 状态
      description: '轮询扫码状态。首次返回 authorized 时立即用 uid 换取 Cookie，并在该次响应中返回明文；之后重复查询返回同一份缓存 Cookie。Cookie 不落库，由设置页写入 PAN115_COOKIE 后统一加密保存，因此该接口是 Cookie 明文的唯一出口，前端拿到后应立即写入设置草稿。会话不存在、已消费或已被清理返回 404，前端应重新申请二维码。'
      parameters:
        - {in: cookie, name: bytemuse_session, required: true, schema: {type: string}, description: 登录签发的管理员会话 Cookie}
        - {in: path, name: sessionId, required: true, schema: {type: string}, description: 申请接口返回的 session_id}
      responses:
        '200':
          description: 当前扫码状态；authorized 时携带 Cookie 明文
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pan115CookieLoginResult'}
              example: {status: authorized, cookie: 'UID=12345678_A1; CID=abcdef123456; SEID=xyz789; KID=abc'}
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: 扫码会话不存在或已过期，请重新获取二维码
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: pan115_login_unknown, message: 115 扫码会话不存在或已过期，请重新获取二维码}
        '502':
          description: '115 返回错误或暂时不可用；message 为本地生成的脱敏中文说明'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: 115 网盘服务未装配
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    delete:
      operationId: cancelPan115CookieLogin
      summary: 取消 115 扫码获取 Cookie 会话
      description: 结束一次扫码会话，使二维码立即失效，避免页面关闭后仍可被扫描。会话不存在时同样返回 204。
      parameters:
        - {in: cookie, name: bytemuse_session, required: true, schema: {type: string}, description: 登录签发的管理员会话 Cookie}
        - {in: path, name: sessionId, required: true, schema: {type: string}, description: 申请接口返回的 session_id}
      responses:
        '204':
          description: 会话已结束；重复取消同样返回 204
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /pan115/account:
    get:
      operationId: getPan115Account
      summary: 读取 115 绑定状态
      description: 已绑定时用本地令牌读取账号资料、容量与云下载配额；未绑定时返回 linked=false，不视为错误。令牌失效时先刷新一次再读取，刷新令牌被吊销则清除绑定并返回 linked=false。云下载配额为附加信息，115 未提供时 quota 为 null，不影响其余字段。
      parameters:
        - {in: cookie, name: bytemuse_session, required: true, schema: {type: string}, description: 登录签发的管理员会话 Cookie}
      responses:
        '200':
          description: 当前绑定状态；未绑定时 account 为 null
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pan115AccountResponse'}
              example: {linked: true, account: {id: '12345678', name: 115 用户, avatar: '', level: VIP, space: {total: {size: 5497558138880, formatted: 5.0TB}, used: {size: 1099511627776, formatted: 1.0TB}, remaining: {size: 4398046511104, formatted: 4.0TB}}, quota: {total: 1500, used: 0, remaining: 1500}}}
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '502':
          description: '115 返回错误或暂时不可用；message 为本地生成的脱敏中文说明'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: 115 网盘服务未装配
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    delete:
      operationId: unlinkPan115
      summary: 解除 115 绑定
      description: 删除本地加密令牌，使 115 回到未登录状态。只影响本地绑定，不撤销 115 侧的授权记录。
      parameters:
        - {in: cookie, name: bytemuse_session, required: true, schema: {type: string}, description: 登录签发的管理员会话 Cookie}
      responses:
        '204':
          description: 已解除绑定；重复解绑同样返回 204
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: 删除绑定失败
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: 115 网盘服务未装配
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /pan115/files:
    get:
      operationId: listPan115Files
      summary: 浏览 115 目录
      description: 读取一个 115 目录，供设置页选择离线下载与 STRM 的保存目录。只读，不创建、不修改、不删除任何文件。directory_id 省略或为空时读取根目录。115 的列表响应同时给出条目、总数与父目录树，因此一次请求即可返回 path，无需再调用目录信息接口。
      parameters:
        - {in: cookie, name: bytemuse_session, required: true, schema: {type: string}, description: 登录签发的管理员会话 Cookie}
        - {in: query, name: directory_id, schema: {type: string}, description: 115 目录 ID；省略或空串读取根目录}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, default: 0}, description: 分页偏移，必须是非负整数}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1150, default: 100}, description: 每页条数；省略或超出 1..1150 时按 100 处理}
      responses:
        '200':
          description: 一页目录内容；path 为根目录到当前目录的完整路径，根目录返回仅含“根目录”一项的数组
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pan115FilePage'}
              example: {directory_id: '0', path: [{id: '0', name: 根目录}], files: [{id: '341789', parent_id: '0', name: 影片目录, is_directory: true, size: 0, pick_code: ''}], total: 1, has_more: false}
        '400':
          description: offset 或 limit 无效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 115 尚未绑定账号
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: pan115_not_linked, message: 115 网盘尚未绑定账号，请先在设置中扫码登录}
        '502':
          description: '115 返回错误或暂时不可用；message 为本地生成的脱敏中文说明'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: 115 网盘服务未装配
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /pan115/library/scan:
    post:
      operationId: scanPan115Library
      summary: 扫描 115 目录并入库
      description: 按设置项 PAN115_SCAN_PATHS 逐目录递归扫描 115 网盘，把识别出番号的视频登记为「已在媒体库」（library_status=present）；文件扩展名沿用生成 strm 的默认视频格式表。每页读取 1150 条，识别不到番号的文件只计入 skipped，不会凭空生成番号；同番号在一个目录里只登记一次。已存在的影片只刷新媒体库状态与更新时间，不覆盖标题、译文、封面与订阅状态。单个目录失败不影响其他目录，失败原因通过 directories[].message 返回。扫描不触发采集、订阅或下载。
      parameters:
        - {$ref: '#/components/parameters/ScanProgressAccept'}
        - {in: cookie, name: bytemuse_session, required: true, schema: {type: string}, description: 登录签发的管理员会话 Cookie}
      responses:
        '200':
          description: 本次扫描入库的汇总结果；无失败目录时 directories[].message 为空串
          content:
            application/x-ndjson:
              schema: {$ref: '#/components/schemas/LibraryScanStreamEvent'}
              example: '{"type":"progress","progress":{"phase":"discovering","processed":20,"total":50,"percent":40,"current":"/movies"}}'
            application/json:
              schema: {$ref: '#/components/schemas/Pan115LibraryScanResult'}
              example: {directories: [{id: '341789', path: /影片/新片, files: 12, matched: 11, created: 8, skipped: 1, message: ''}], files: 12, matched: 11, created: 8, skipped: 1}
        '400':
          description: PAN115_SCAN_PATHS 配置非法
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 尚未配置扫描目录，或 115 尚未绑定账号
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: pan115_scan_not_configured, message: 尚未配置 115 扫描目录，请先在设置中添加目录}
        '502':
          description: '115 返回错误或暂时不可用；message 为本地生成的脱敏中文说明'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: 115 网盘服务未装配
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /pan115/offline/tasks:
    get:
      operationId: listPan115OfflineTasks
      summary: 查询 115 离线任务
      description: 读取一页 115 离线任务；progress 已归一化为 0-100。只读，不改变任务状态。
      parameters:
        - {in: cookie, name: bytemuse_session, required: true, schema: {type: string}, description: 登录签发的管理员会话 Cookie}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}, description: 页码，从 1 开始；小于 1 按 1 处理}
      responses:
        '200':
          description: 一页离线任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pan115OfflinePage'}
              example: {page: 1, page_count: 1, tasks: [{hash: 0123456789abcdef0123456789abcdef01234567, status: 1, progress: 100, file_id: '341790', directory_id: '0'}]}
        '400':
          description: page 不是正整数
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 115 尚未绑定账号
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '502':
          description: '115 返回错误或暂时不可用；message 为本地生成的脱敏中文说明'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: 115 网盘服务未装配
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    post:
      operationId: addPan115OfflineTask
      summary: 提交 115 离线任务
      description: 手动提交一个磁力链接或下载地址到 115 离线下载。directory_id 省略或为空时使用设置中的「离线下载保存目录」，该设置也为空时保存到根目录。重复提交同一磁力返回 409，message 说明 115 已存在该任务；订阅下载链路把该结果视为提交成功。
      parameters:
        - {in: cookie, name: bytemuse_session, required: true, schema: {type: string}, description: 登录签发的管理员会话 Cookie}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Pan115OfflineTaskRequest'}
            example: {uri: 'magnet:?xt=urn:btih:0123456789abcdef0123456789abcdef01234567', directory_id: ''}
      responses:
        '201':
          description: 已受理；hash 为 115 返回的信息哈希
          content:
            application/json:
              schema:
                type: object
                required: [hash]
                properties:
                  hash: {type: string, description: 115 离线任务的信息哈希}
              example: {hash: 0123456789abcdef0123456789abcdef01234567}
        '400':
          description: 磁力链接或下载地址为空，或请求体不是有效的离线任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: invalid_request, message: 磁力链接或下载地址不能为空}
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 115 尚未绑定账号，或 115 已存在该离线任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: pan115_offline_exists, message: 115 已存在该离线任务}
        '502':
          description: '115 返回错误或暂时不可用；message 为本地生成的脱敏中文说明'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: 115 网盘服务未装配
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
