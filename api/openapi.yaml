    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 8
          maxLength: 256
        remember:
          type: boolean
          default: false
          description: 勾选“记住密码”时为 true，会话有效期由 1 天延长至 30 天；省略按 false 处理。
    LoginResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
        username:
          type: string
    Media:
      type: object
      required: [id, code, title, video_type, still_photos, subscription_status, library_status, display_status, created_at, updated_at]
      properties:
        details:
          description: 仅 GET /media/{mediaId} 返回；列表接口省略。
          $ref: '#/components/schemas/MediaDetails'
        video_type:
          type: [string, 'null']
          enum: [censored, uncensored, uncensored_cracked, leaked, null]
          description: 影片单值类型；censored 有码，uncensored 无码，uncensored_cracked 无码破解，leaked 流出；null 尚未分类，历史数据不推断回填
          example: censored
        id:
          type: string
        code:
          type: string
          description: 原始番号，保留数据源中的空格和大小写
        title:
          type: string
        translated_title:
          type: [string, 'null']
        poster_url:
          type: [string, 'null']
          format: uri
          description: 竖版或备用封面；banner_url 为空时用于卡片回退
        banner_url:
          type: [string, 'null']
          format: uri
          description: 横向大图，番号宫格优先展示该字段
        preview_url:
          type: [string, 'null']
          format: uri
          description: 预告视频地址；null 表示没有可播放预告
        still_photos:
          type: array
          description: 按数据源顺序排列的剧照地址；没有剧照时为空数组
          items:
            type: string
            format: uri
        release_date:
          type: [string, 'null']
          format: date
        duration_minutes:
          type: [integer, 'null']
          minimum: 0
        subscription_status:
          $ref: '#/components/schemas/SubscriptionStatus'
        library_status:
          $ref: '#/components/schemas/LibraryStatus'
        display_status:
          $ref: '#/components/schemas/MediaDisplayStatus'
        active_subscription:
          description: 当前活动订阅摘要；未订阅时为 null
          oneOf:
            - $ref: '#/components/schemas/SubscriptionSummary'
            - type: 'null'
        download_status:
          description: 最近下载任务状态；从未创建下载任务时为 null
          oneOf:
            - $ref: '#/components/schemas/DownloadStatus'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MediaDetails:
      type: object
      description: 已保存的影片扩展资料；暂无可靠来源的字段为 null，不回填历史数据。
      required: [actors, tags, producer, publisher, series, release_code, plot, director, rating, want_count, translation_engine, mosaic, censored, resolution]
      properties:
        actors:
          type: array
          description: 演员姓名；未采集时为空数组
          items: {type: string}
        tags:
          type: array
          description: 影片标签；未采集时为空数组
          items: {type: string}
        producer:
          type: [string, 'null']
          description: 制作商；无已保存资料时为 null
        publisher:
          type: [string, 'null']
          description: 发行商；无已保存资料时为 null
        series:
          type: [string, 'null']
          description: 系列；无已保存资料时为 null
        release_code:
          type: [string, 'null']
          description: 发行码，独立于番号；当前未采集，返回 null
        plot:
          type: [string, 'null']
          description: 影片简介；当前未采集，返回 null
        director:
          type: [string, 'null']
          description: 导演；当前未采集，返回 null
        rating:
          type: [number, 'null']
          description: 来源评分；当前未采集且无统一评分口径，返回 null
        want_count:
          type: [integer, 'null']
          minimum: 0
          description: 想看人数；当前未采集，返回 null，不能用 null 代表零人
        translation_engine:
          type: [string, 'null']
          description: 生成该译文的历史引擎；当前未记录，返回 null，不使用当前系统配置推断
        mosaic:
          type: [boolean, 'null']
          description: 是否有马赛克；censored 为 true，uncensored 和 uncensored_cracked 为 false，leaked 或未知分类为 null
        censored:
          type: [boolean, 'null']
          description: 是否属于有码发行；censored 和 uncensored_cracked 为 true，uncensored 为 false，leaked 或未知分类为 null
        resolution:
          type: [string, 'null']
          description: 已确认的视频分辨率；当前未采集或探测，返回 null，不从文件名猜测
      example:
        actors: [演员甲]
        tags: [剧情]
        producer: 制作商示例
        publisher: 发行商示例
        series: null
        release_code: null
        plot: null
        director: null
        rating: null
        want_count: null
        translation_engine: null
        mosaic: true
        censored: true
        resolution: null
    MediaPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Media'
    Actor:
      type: object
      required: [name, photo, limit_date]
      properties:
        name:
          type: string
          description: 演员名称，也是写接口中的稳定标识
        photo:
          type: [string, 'null']
          format: uri
          description: 演员头像地址；null 表示暂无头像
        limit_date:
          type: [string, 'null']
          format: date
          description: 订阅检索的最早发行日期；null 表示未订阅
    ActorSubscriptionRequest:
      type: object
      required: [limit_date]
      properties:
        limit_date:
          type: string
          format: date
          description: 订阅检索的最早发行日期，格式必须为 YYYY-MM-DD
    ActorPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Actor'
    Subscription:
      type: object
      required: [id, media_id, status, mode, filter, created_at, updated_at, version]
      properties:
        id:
          type: string
        media_id:
          type: string
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        mode:
          type: string
          enum: [strict, preload]
        filter:
          $ref: '#/components/schemas/SubscriptionFilter'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
          description: 乐观锁版本；每次编辑成功后加一，取消接口返回删除前的快照且不再持久化该记录
        media:
          description: 订阅内嵌的媒体卡片数据；订阅列表、创建、编辑与取消订阅的响应统一包含该字段，客户端无需再按 media_id 反查
          $ref: '#/components/schemas/Media'
    SubscriptionSummary:
      type: object
      required: [id, media_id, status, mode, filter, created_at, updated_at, version]
      properties:
        id:
          type: string
        media_id:
          type: string
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        mode:
          type: string
          enum: [strict, preload]
        filter:
          $ref: '#/components/schemas/SubscriptionFilter'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    SubscriptionFilter:
      type: object
      description: 资源筛选规则；布尔字段省略时按 false，体积字段为 null 时不限制
      additionalProperties: true
      properties:
        only_chinese:
          type: boolean
          description: 仅选择带中文字幕的资源
        only_uc:
          type: boolean
          description: 仅选择无码资源
        exclude_uc:
          type: boolean
          description: 排除无码资源
        only_free:
          type: boolean
          description: 仅选择免费资源
        only_uhd:
          type: boolean
          description: 仅选择 UHD 资源
        exclude_uhd:
          type: boolean
          description: 排除 UHD 资源
        min_size:
          type: [number, 'null']
          minimum: 0
          description: 最小资源体积，单位 MB；null 表示不限制
        max_size:
          type: [number, 'null']
          minimum: 0
          description: 最大资源体积，单位 MB；null 表示不限制
    CreateSubscriptionRequest:
      type: object
      required: [media_id, mode]
      properties:
        media_id:
          type: string
        mode:
          type: string
          enum: [strict, preload]
          description: strict 为严格模式，preload 为预下载模式
        filter:
          $ref: '#/components/schemas/SubscriptionFilter'
          default: {}
    UpdateSubscriptionRequest:
      type: object
      required: [mode, filter, version]
      properties:
        mode:
          type: string
          enum: [strict, preload]
          description: strict 为严格模式，preload 为预下载模式
        filter:
          $ref: '#/components/schemas/SubscriptionFilter'
        version:
          type: integer
          minimum: 1
          description: 客户端最后读取到的订阅版本，过期时返回 409
    SubscriptionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Subscription'
    DownloadTask:
      type: object
      required: [id, media_id, code, available_actions, status, created_at, updated_at]
      properties:
        code:
          type: [string, 'null']
          description: 关联影片番号，用于列表展示；关联缺失时为 null，不用内部媒体 ID 替代
          example: TEST-001
        available_actions:
          type: array
          description: 当前状态和下载器实际能力允许的操作；空数组表示无可用操作；失败任务不含 delete_files
          items: {type: string, enum: [pause, stop, resume, retry, delete, delete_files]}
          example: [stop, delete, delete_files]
        id:
          type: string
        media_id:
          type: string
        status:
          $ref: '#/components/schemas/DownloadStatus'
        source_site:
          type: [string, 'null']
          description: 选中资源的站点名；尚未选中时为 null，BT 站显示 Nyaa BT
        source_kind:
          type: [string, 'null']
          enum: [pt, bt, null]
          description: 资源协议类别；尚未选中时为 null
        downloader:
          type: [string, 'null']
          description: 本次提交使用的下载器；尚未选中资源时为 null
        info_hash:
          type: [string, 'null']
          description: 选中种子的 40 位 info hash；用于下载器结果回查与去重
        transfer_status:
          type: [string, 'null']
          enum: [downloading, paused, stopped, failed, completed, null]
          description: 最近一次 qBittorrent 同步的传输状态；未同步为 null，不等于任务状态
        added_at:
          type: [string, 'null']
          description: 下载器加入时间，UTC RFC3339；尚未同步为 null
        completed_at:
          type: [string, 'null']
          description: 下载器完成时间，UTC RFC3339；未完成或尚未同步为 null
        external_id:
          type: [string, 'null']
        error_message:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DownloadPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/DownloadTask'
    ScheduledTask:
      type: object
      required: [name, cron, last_run, running]
      properties:
        name:
          type: string
          description: 定时任务名称
        cron:
          type: string
          description: 五段式 Cron 表达式
        last_run:
          type: [string, 'null']
          format: date-time
          description: 最近一次开始执行的时间；进程重启后为空
        running:
          type: boolean
          description: 当前是否正在执行
    ScheduledTaskPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ScheduledTask'
    LogRecord:
      type: object
      required: [time, level, category, message]
      properties:
        time:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warning, error]
        category:
          type: string
        message:
          type: string
        attrs:
          type: object
          description: 原样保存的附加字段，不进行敏感值脱敏
          additionalProperties: true
    LogPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/LogRecord'
    Dashboard:
      type: object
      required: [active_subscriptions, completed_downloads, media_count]
      properties:
        active_subscriptions:
          type: integer
        completed_downloads:
          type: integer
        media_count:
          type: integer
    SystemVersion:
      type: object
      required: [current, latest, has_update, release_url, checked_at, check_error]
      description: 检查更新结果；远端检查失败时 latest、release_url 为空串且 has_update 为 false，当前版本始终可用
      properties:
        current: {type: string, description: 当前运行版本，来自 BYTEMUSE_VERSION；未注入时为 dev}
        latest: {type: string, description: '发布仓库 version.json 记录的版本；检查失败时为空串'}
        has_update: {type: boolean, description: latest 按点分数字段高于 current 时为 true；current 为 dev 或含非数字字段时不判定升级}
        release_url: {type: string, description: '发布仓库地址，取自 version.json 的 source；检查失败时为空串'}
        checked_at: {type: string, format: date-time, description: 本次结论的产生时间，UTC RFC 3339}
        check_error: {type: string, description: '远端检查的脱敏中文失败原因；已确认可用时为空串'}
    SystemSettings:
      type: object
      required: [database_driver, values, configured]
      properties:
        database_driver:
          type: string
          enum: [sqlite, postgres, mysql]
          description: 数据库引擎，由部署环境管理，只读
        values:
          type: object
          additionalProperties:
            type: string
          description: >-
            设置值。键名与旧版 template.env、对标站 /config 一致；敏感值也会在已登录管理员会话中回显，
            按对标站设置页分组维护：站点、Emby、Plex、Jellyfin、微信、Telegram、Qbittorrent、
            Transmission、aria2、迅雷、CloudDrive2、115网盘、过滤、排序、定时任务、翻译、Agent、其他。
            布尔取值固定为 true / false；数字为非负整数字符串；DEFAULT_FILTER 为过滤规则 JSON 字符串；
            DEFAULT_SORT 为逗号分隔的排序标签（uc、!uc、seeders、chinese、uhd、!uhd、site、free）；
            PTFANS_AUTH_TYPE、ROUSIPRO_AUTH_TYPE、NICEPT_AUTH_TYPE 为 key（密钥）或 cookie（Cookie），默认 key，空值使用密钥；
            PTFANS_API_KEY、ROUSIPRO_API_KEY、NICEPT_API_KEY 是分别加密保存的密钥，空值表示未配置；
            三站支持密钥分页搜索和种子下载；密钥与 Cookie 独立保存，切换模式不清除另一种凭据，密钥模式不回退 Cookie。
            PTTime 仅使用 PTT_COOKIE 搜索和下载，不使用受限 RSS。PTT_AUTH_TYPE、PTT_PASSKEY、PTT_UID 为兼容历史配置保留，运行时不读取，设置页不再提供。
            MAIN_SITE 取 ALL / 馒头 / BT / PTT / NicePT / PTFans / RousiPro；PTFANS_COOKIE 用于 PTFans 9KG 专区，ROUSIPRO_COOKIE 用于 RousiPro 9KG 目录，均为加密保存的管理员凭据，空值表示未配置；旧 ROUSI_COOKIE 不再显示或接受写入。IMAGE_MODE 取 INVISIBLE / VISIBLE / BLUR；PT_DEFAULT_DOWNLOADER 取 qbittorrent / transmission；BT_DEFAULT_DOWNLOADER 取 qbittorrent / transmission / aria2 / thunder / pan115（不含 CloudDrive2）；BYPASS_ENGINE 取 cloudflare_bypass_for_scraping / flaresolverr / scrapling，空值表示关闭；BYPASS_URL 为所选增强服务地址；LOG_RETENTION_DAYS 为日志保留天数，默认 30，0 或空值表示不自动删除；TRANSLATION_ENGINE 取 none / openai / google / baidu / deeplx；DEEPLX_URL 为 DeepLX 服务地址，可只填服务地址（例如 http://127.0.0.1:1188）或直接填 /translate 完整地址；TRANSLATION_PROMPT 仅在 OpenAI 翻译时作为翻译 system prompt，留空使用内置提示词；翻译的 OpenAI 兼容配置独立保存在 TRANSLATION_OPENAI_URL、TRANSLATION_OPENAI_MODEL、TRANSLATION_OPENAI_API_KEY，与对话 Agent 的配置互不影响，三者任一为空时 OpenAI 翻译引擎视为未配置，设置页禁用 OpenAI 选项并把已选引擎回落为 none；AGENT_ENABLE 为 true 时启用 Telegram 与企业微信的对话 Agent，默认 false；Agent 使用 OPENAI_URL、OPENAI_MODEL、OPENAI_API_KEY，三者任一为空时对话入口返回未启用提示，斜杠命令与番号订阅不受影响；AGENT_SYSTEM_PROMPT 仅用于渠道 Agent 对话，留空使用内置提示词。
            PAN115_SAVE_PATH 为 115 网盘离线下载的保存目录 ID，空值表示保存到根目录；
            PAN115_COOKIE 为 115 Cookie（UID、CID、SEID），用于 115 生活事件；可手动填写，也可用 POST /pan115/cookie/login/sessions 按渠道扫码获取，加密保存，空字符串清除；Cookie 与 OpenAPI 令牌是两套独立凭据，互不替代。
            PAN115_SCAN_PATHS 为 115 网盘扫描目录的 JSON 数组字符串，元素形如 {"id":"目录 ID","path":"展示用绝对路径"}，
            ID 与路径都不可为空、ID 不可重复，空字符串或 [] 表示不扫描任何目录；目录 ID 由 GET /pan115/files 逐级读取，前端以只读输入框加目录选择弹窗维护，避免手填无效 ID。
            保存后由 POST /pan115/library/scan 逐目录递归扫描（每页读取 1150 条），把识别出番号的视频登记为「已在媒体库」；
            识别不到番号的文件只计入 skipped，已存在的影片只刷新媒体库状态，不覆盖标题、译文、封面与订阅状态。
            115 账号、令牌与离线任务由 /pan115 接口管理，令牌加密落库，不通过设置接口读写。
            GOOGLE_API_KEY 为 Google Cloud Translation API 密钥，留空时 Google 引擎改用免密钥接口（无需申请，按来源 IP 限流）；填写后走官方接口，配额与计费按 key 所属项目结算。
            BAIDU_APP_ID 与 BAIDU_API_KEY 为百度翻译开放平台的 APPID 与开发者密钥（密钥），请求按 MD5(appid+q+salt+密钥) 计算 sign 签名，需先在开放平台开通文本翻译服务，二者任一为空时百度引擎视为未配置。
            微信与 Telegram 各自独立的消息通知开关：前缀分别为 WECHAT_NOTIFY_ 与 TELEGRAM_NOTIFY_，
            后缀取 SUBSCRIBE、SUBSCRIBE_FAILED、DOWNLOAD_START、DOWNLOAD_COMPLETE、DOWNLOAD_FAILED、AGENT_CHAT，
            依次对应订阅成功、订阅失败、开始下载、下载完成、下载失败与 Agent 对话。
            推送类通知默认 false，升级后不自动开启；AGENT_CHAT 默认 true，控制该渠道是否允许自然语言对话，关闭后斜杠命令与番号订阅仍可用。
            推送目标分别取 WECHAT_TO_USER 与 TELEGRAM_CHAT_ID，目标为空或渠道未配置时跳过推送。
            RANK_SCHEDULE_TIME、ACTOR_SCHEDULE_TIME、TAG_SCHEDULE_TIME、DOWNLOAD_SCHEDULE_TIME 为标准 5 段 cron
            （分 时 日 月 周，如 0 20 * * * 表示每天 20:00），空值表示不注册该定时任务；非法表达式保存时返回 400 invalid_setting；保存后立即重排，无需重启后端。
          properties:
            PTT_AUTH_TYPE: {type: string, deprecated: true, enum: [key, cookie, ''], description: '历史兼容字段，不参与运行；PTTime 固定使用 PTT_COOKIE'}
            PAN115_EVENT_ENABLE: {type: string, enum: ['true', 'false', ''], default: 'false', description: '115 生活事件监听；Cookie 为空时强制关闭并保存 false（包括部分更新），空值或 false 关闭，保存后下一轮生效。每 30 秒轮询，失败后 60 秒重试；需同账号 OpenAPI 绑定、事件 Cookie、115 STRM 映射和 STRM_PLAY_BASE。首次启用建立当前事件基线，不回放历史；后续按持久化游标续接。批次合并后仅扫描所选 115 映射，遵循各映射格式、min_size_mb 和排除文件/夹规则生成或更新 STRM，失败不前移游标，不自动删除旧文件。'}
            PAN115_COOKIE: {type: string, description: '115 Cookie，含 UID、CID、SEID，禁止换行；用于 115 生活事件，需与 OpenAPI 绑定为同一账号并在 115 开启生活事件记录。可手动填写，也可用 POST /pan115/cookie/login/sessions 扫码获取。加密存储，空字符串清除并同时强制关闭 PAN115_EVENT_ENABLE；不可用于 OpenAPI Bearer 认证。管理员设置接口沿用现有敏感字段回显约定。'}
            RANK_SCHEDULE_TIME: {type: string, default: '0 20 * * *', example: '0 20 * * *', description: '榜单订阅定时任务，标准 5 段 cron（分 时 日 月 周）；空值表示不注册该任务，非法表达式保存时返回 400 invalid_setting；保存后立即重排，无需重启后端'}
            ACTOR_SCHEDULE_TIME: {type: string, default: '0 21 * * *', example: '0 21 * * *', description: '演员订阅定时任务，标准 5 段 cron（分 时 日 月 周）；空值表示不注册该任务，非法表达式保存时返回 400 invalid_setting；保存后立即重排，无需重启后端'}
            TAG_SCHEDULE_TIME: {type: string, default: '30 21 * * *', example: '30 21 * * *', description: '标签订阅定时任务，标准 5 段 cron（分 时 日 月 周）；空值表示不注册该任务，非法表达式保存时返回 400 invalid_setting；保存后立即重排，无需重启后端'}
            DOWNLOAD_SCHEDULE_TIME: {type: string, default: '0 22 * * *', example: '0 22 * * *', description: '番号订阅定时任务，标准 5 段 cron（分 时 日 月 周），建议排在榜单与演员订阅之后；空值表示不注册该任务，非法表达式保存时返回 400 invalid_setting；保存后立即重排，无需重启后端'}
            BYPASS_USE_PROXY: {type: string, enum: ['true', 'false'], default: 'false', example: 'false', description: '爬虫增强是否使用系统 PROXY，默认关闭；增强为不使用时强制关闭。开启且 PROXY 非空时透传给增强服务访问源站，连接增强服务本身直连；配置启动时读取，保存后需重启生效'}
            PTFANS_AUTH_TYPE: {type: string, enum: [key, cookie, ''], default: key, description: 'PTFans 鉴权方式；空值默认密钥'}
            ROUSIPRO_AUTH_TYPE: {type: string, enum: [key, cookie, ''], default: key, description: 'RousiPro 鉴权方式；空值默认密钥'}
            NICEPT_AUTH_TYPE: {type: string, enum: [key, cookie, ''], default: key, description: 'NicePT 鉴权方式；空值默认密钥'}
            PTT_PASSKEY: {type: string, deprecated: true, default: '', description: '历史兼容凭据，加密保留但不参与运行；空字符串清除'}
            PTT_UID: {type: string, deprecated: true, pattern: '^(|[0-9]*[1-9][0-9]*)$', default: '', description: '历史兼容 UID，不参与运行；空字符串未配置，不接受 0'}
            PTFANS_API_KEY: {type: string, default: '', description: 'PTFans 访问令牌；加密存储，空字符串清除，不是 Tracker PassKey'}
            ROUSIPRO_API_KEY: {type: string, default: '', description: 'RousiPro API Key；加密存储，空字符串清除'}
            NICEPT_API_KEY: {type: string, default: '', description: 'NicePT 访问令牌；加密存储，空字符串清除，不是 Tracker PassKey'}
            TRANSLATION_OPENAI_URL: {type: string, default: '', description: '翻译模型接口地址（OpenAI 兼容），例如 http://127.0.0.1:8080/v1；与对话 Agent 的 OPENAI_URL 相互独立'}
            TRANSLATION_OPENAI_MODEL: {type: string, default: '', description: '翻译模型名称；与对话 Agent 的 OPENAI_MODEL 相互独立'}
            TRANSLATION_OPENAI_API_KEY: {type: string, default: '', description: '翻译模型 API Key；加密存储，空字符串清除，与对话 Agent 的 OPENAI_API_KEY 相互独立'}
            WECHAT_NOTIFY_SUBSCRIBE: {type: string, enum: ['true', 'false'], default: 'false', example: 'false', description: '微信订阅成功通知开关，默认关闭'}
            WECHAT_NOTIFY_SUBSCRIBE_FAILED: {type: string, enum: ['true', 'false'], default: 'false', example: 'false', description: '微信订阅失败通知开关，默认关闭'}
            WECHAT_NOTIFY_DOWNLOAD_START: {type: string, enum: ['true', 'false'], default: 'false', example: 'false', description: '微信开始下载通知开关，默认关闭'}
            WECHAT_NOTIFY_DOWNLOAD_COMPLETE: {type: string, enum: ['true', 'false'], default: 'false', example: 'false', description: '微信下载完成通知开关，默认关闭'}
