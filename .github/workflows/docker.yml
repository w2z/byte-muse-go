name: build-image

# 主仓库推送后自动构建镜像并把版本写回 version.json。
# 触发条件排除 version.json：版本回写提交只改该文件，不会再次触发构建，避免自触发循环。
on:
  push:
    branches: [main]
    paths-ignore:
      - version.json
  workflow_dispatch:

# 同一分支只保留一个构建任务：新提交触发时取消仍在运行的旧构建，最终产出对应最新提交的镜像。
concurrency:
  group: build-image
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # 版本号取自提交计数，需要完整历史。
          fetch-depth: 0

      - name: 计算版本
        id: ver
        run: |
          echo "version=0.1.$(git rev-list --count HEAD -- ':(exclude)version.json')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: 准备构建器
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BYTEMUSE_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}:sha-${{ steps.ver.outputs.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 写回 version.json
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          COMMIT: ${{ steps.ver.outputs.commit }}
          SHA: ${{ steps.ver.outputs.sha }}
          BUILT_AT: ${{ steps.ver.outputs.built_at }}
          DIGEST: ${{ steps.push.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          jq -n --arg v "$VERSION" --arg c "$COMMIT" --arg s "$SHA" \
                --arg b "$BUILT_AT" --arg d "$DIGEST" --arg r "$REPO" \
            '{version:$v, commit:$c, short_commit:$s, built_at:$b,
              image:("ghcr.io/" + $r), digest:$d,
              tags:[$v, ("sha-" + $s), "latest"],
              source:"https://github.com/" + $r,
              note:"由 GitHub Actions 构建成功后自动写入，请勿手工修改"}' > version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then
            echo "version.json 无变化，跳过提交"
          else
            git commit -m "🔧 chore(发布): 更新 version.json 到 ${VERSION}"
            git push
          fi