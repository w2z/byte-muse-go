name: build-image

# 主仓库推送后自动构建镜像。版本记录 version.json 由 deploy/version.ps1 在提交代码时写入，
# 构建流程只读取和校验版本；contents 写权限仅用于发布运行升级包到 Release。
# 触发条件只列出会改变镜像内容的构建输入：文档、规范、README.md、version.json、接口契约
# 以及部署脚本、本地开发脚本的改动都不触发构建，避免纯文档提交占用构建资源。
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/Dockerfile'
      - '.dockerignore'
  workflow_dispatch:

# 同一分支只保留一个构建任务：新提交触发时取消仍在运行的旧构建，最终产出对应最新提交的镜像。
concurrency:
  group: build-image
  cancel-in-progress: true

permissions:
  # 只发布运行升级包到 Release，不回写源码或 version.json。
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # 版本号取自提交计数，需要完整历史。
          fetch-depth: 0

      - name: 校验版本记录
        id: ver
        run: |
          expected="0.1.$(git rev-list --count HEAD -- ':(exclude)version.json')"
          recorded=$(jq -r '.version // ""' version.json)
          if [ "$recorded" != "$expected" ]; then
            echo "::error::version.json 记录版本 $recorded，当前提交应发布 $expected；推送代码前先执行 deploy/version.ps1（或启用 .githooks 钩子）更新版本记录。"
            exit 1
          fi
          sha=$(jq -r '.short_commit // ""' version.json)
          if [ -z "$sha" ]; then
            echo "::error::version.json 缺少 short_commit，无法生成 sha- 标签。"
            exit 1
          fi
          echo "version=$recorded" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: 准备构建器
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BYTEMUSE_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}:sha-${{ steps.ver.outputs.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 导出完整升级包
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/upgrades"
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --build-arg "BYTEMUSE_VERSION=$RELEASE_VERSION" --file deploy/Dockerfile --output "type=local,dest=$RUNNER_TEMP/runtime-$arch" .
            runtime="$RUNNER_TEMP/package-$arch"
            mkdir -p "$runtime"
            cp -R "$RUNNER_TEMP/runtime-$arch/app/bytemuse" "$RUNNER_TEMP/runtime-$arch/app/web" "$runtime/"
            jq -n --arg version "$RELEASE_VERSION" '{version: $version, protocol: 1}' > "$runtime/version.json"
            package="$RUNNER_TEMP/upgrades/bytemuse-linux-$arch.tar.gz"
            tar -czf "$package" -C "$runtime" bytemuse web version.json
            sha256sum "$package" | cut -d ' ' -f 1 > "$package.sha256"
          done

      - name: 发布容器内升级包
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "ByteMuse $RELEASE_VERSION" --notes "容器内升级运行包，包含同版本的后端程序与前端资源。" --draft
          fi
          gh release upload "$tag" "$RUNNER_TEMP/upgrades/"* --clobber
          gh release edit "$tag" --draft=false
