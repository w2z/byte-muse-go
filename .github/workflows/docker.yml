name: build-image

# 主仓库推送后自动构建镜像。版本记录 version.json 由 deploy/version.ps1 在提交代码时写入，
# 构建流程只读取和校验，不回写仓库，因此不需要 contents 写权限。
# 触发条件只列出会改变镜像内容的构建输入：文档、规范、README.md、version.json、接口契约
# 以及部署脚本、本地开发脚本的改动都不触发构建，避免纯文档提交占用构建资源。
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/Dockerfile'
      - '.dockerignore'
  workflow_dispatch:

# 同一分支只保留一个构建任务：新提交触发时取消仍在运行的旧构建，最终产出对应最新提交的镜像。
concurrency:
  group: build-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # 版本号取自提交计数，需要完整历史。
          fetch-depth: 0

      - name: 校验版本记录
        id: ver
        run: |
          expected="0.1.$(git rev-list --count HEAD -- ':(exclude)version.json')"
          recorded=$(jq -r '.version // ""' version.json)
          if [ "$recorded" != "$expected" ]; then
            echo "::error::version.json 记录版本 $recorded，当前提交应发布 $expected；推送代码前先执行 deploy/version.ps1（或启用 .githooks 钩子）更新版本记录。"
            exit 1
          fi
          sha=$(jq -r '.short_commit // ""' version.json)
          if [ -z "$sha" ]; then
            echo "::error::version.json 缺少 short_commit，无法生成 sha- 标签。"
            exit 1
          fi
          echo "version=$recorded" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: 准备构建器
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BYTEMUSE_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}:sha-${{ steps.ver.outputs.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
